<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Web商店街 | オンライン商店街</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-mark">街</span>
      <h1>Web商店街</h1>
      <p>ONLINE SHOPPING STREET</p>
    </div>
    <p class="tagline">アバターで歩いて、お店をめぐる。オンラインの商店街。</p>

    <a href="user/login.html" class="role-btn">
      <span class="role-icon"><span class="icon" data-icon="users"></span></span>
      <div>
        <p class="role-title">来場者として入る</p>
        <p class="role-sub">アバターで街を回遊 / お店をのぞく</p>
      </div>
      <span class="role-chevron"><span class="icon" data-icon="chevron"></span></span>
    </a>

    <a href="admin/login.html" class="role-btn">
      <span class="role-icon admin"><span class="icon" data-icon="shield"></span></span>
      <div>
        <p class="role-title">運営・店舗オーナー様用</p>
        <p class="role-sub">店舗登録 / 情報編集 / 配置変更</p>
      </div>
      <span class="role-chevron"><span class="icon" data-icon="chevron"></span></span>
    </a>

    <p class="muted center" style="font-size: 11px; margin-top: 22px;">
      ※ これは初回打ち合わせ前の提案用HTMLモックです（実データなし）
    </p>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
