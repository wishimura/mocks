<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>3D版（試作） | Web商店街</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app">
  <div class="header">
    <a href="town-walk.html" class="back"><span class="icon" data-icon="back"></span></a>
    <h1>3D版 <span class="badge badge-new" style="vertical-align:middle;">low-poly 試作</span></h1>
    <a href="mypage.html" class="back" style="margin-left:auto;"><span class="icon" data-icon="user"></span></a>
  </div>

  <div class="main">
    <div class="card" style="background:var(--accent-light); border-color:#bfe7e1; margin-bottom:12px;">
      <p style="margin:0; font-size:13px;">
        <span class="icon" data-icon="sparkle" style="color:var(--accent);"></span>
        <strong>本物の3D（low-poly）の試作</strong>：<strong>左右で向きを変える・前後で進む</strong>（カメラが自分の背後に追従）。画面ドラッグでも向きを変えられます。お店に近づくと紹介ウィンドウが出ます。今の2.5D版（歩く街）はそのまま残しています。
      </p>
    </div>

    <!-- 3Dシーン（Three.jsがここに描画） -->
    <div class="walk-wrap" id="wrap3d" style="height:58vh; max-height:560px;">
      <div class="walk-hud">
        <span style="pointer-events:auto;"><button class="walk-pill" id="fsBtn">⤢ 全画面で遊ぶ</button></span>
        <span></span>
      </div>
      <div class="rotate-hint" id="rotateHint">📱 端末を横に｜左右で向き・前後で進む</div>

      <aside class="walk-info" id="walkInfo">
        <button class="wi-close" id="walkInfoClose" aria-label="閉じる"><span class="icon" data-icon="x"></span></button>
        <div class="wi-em" data-w="em">🍞</div>
        <p class="wi-eyebrow">SHOP GUIDE</p>
        <p class="wi-title" data-w="shop">お店</p>
        <p class="wi-cat" data-w="cat">カテゴリ</p>
        <div class="wi-thumbs">
          <div class="wi-thumb" style="background:linear-gradient(135deg,#e8623d,#f0a25c);">🛍️</div>
          <div class="wi-thumb" style="background:linear-gradient(135deg,#2bb3a3,#7cd1c5);">🎁</div>
          <div class="wi-thumb" style="background:linear-gradient(135deg,#e0a02c,#f0c46a);">✨</div>
        </div>
        <p class="wi-desc" data-w="desc">お店の紹介文がここに表示されます。</p>
        <a href="#" class="ec-btn ec-base" data-demo="ECサイト（BASE/Shopify）へ移動します（外部・モック）" style="margin-bottom:8px;">
          <span class="icon" data-icon="bag"></span><div data-w="ec">BASEで買う</div>
        </a>
        <button class="btn btn-block" data-goto="shop.html"><span class="icon" data-icon="store"></span> お店に入る</button>
      </aside>

      <div class="dpad">
        <button class="dbtn up" data-dir="up" aria-label="上"><span class="icon" data-icon="chevron" style="transform:rotate(-90deg);"></span></button>
        <button class="dbtn left" data-dir="left" aria-label="左"><span class="icon" data-icon="chevron" style="transform:rotate(180deg);"></span></button>
        <button class="dbtn right" data-dir="right" aria-label="右"><span class="icon" data-icon="chevron"></span></button>
        <button class="dbtn down" data-dir="down" aria-label="下"><span class="icon" data-icon="chevron" style="transform:rotate(90deg);"></span></button>
      </div>
    </div>

    <button class="btn btn-secondary btn-block" style="margin-top:14px;" data-goto="town-walk.html">
      <span class="icon" data-icon="back"></span> 2.5D版（歩く街）にもどる
    </button>
  </div>

  <nav class="bottom-nav">
    <a href="town-walk.html" data-page="town-walk.html"><span class="nav-icon" data-icon="map"></span>街マップ</a>
    <a href="list.html" data-page="list.html"><span class="nav-icon" data-icon="store"></span>お店一覧</a>
    <a href="mypage.html" data-page="mypage.html"><span class="nav-icon" data-icon="user"></span>マイページ</a>
  </nav>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../js/app.js"></script>
<script src="../js/town3d.js"></script>
</body>
</html>
