<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>こむぎベーカリー | Web商店街</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app">
  <div class="header">
    <a href="town-walk.html" class="back"><span class="icon" data-icon="back"></span></a>
    <h1>お店ページ</h1>
    <button class="back" data-toggle data-demo="お気に入りに追加しました（モック）"><span class="icon" data-icon="heart"></span></button>
  </div>

  <div class="main">
    <div class="detail-hero" style="--dh:linear-gradient(135deg,#e8623d 0%,#f0a25c 120%);">
      <span class="dh-em">🍞</span>
      <div class="dh-content">
        <h2>こむぎベーカリー</h2>
        <div class="meta">
          <span>食べもの・パン</span>
          <span>SPRING MARCHÉ 出店</span>
        </div>
      </div>
    </div>

    <div class="card">
      <p style="margin:0;">
        毎朝焼きあげる、国産小麦の食パンとハード系が自慢の小さなパン屋です。
        マルシェ限定の「さくら食パン」も販売中。お取り寄せはオンラインストアからどうぞ。
      </p>
    </div>

    <p class="section-title">オンラインで買う</p>
    <div class="link-row">
      <a href="#" class="ec-btn ec-base" data-demo="BASEのストアへ移動します（外部サイト・モック）">
        <span class="icon" data-icon="bag"></span>
        <div>BASE ストアで購入<div class="ec-sub">komugi-bakery.base.shop</div></div>
        <span class="icon ec-arrow" data-icon="external"></span>
      </a>
      <a href="#" class="ec-btn ec-shopify" data-demo="Shopifyのストアへ移動します（外部サイト・モック）">
        <span class="icon" data-icon="cart"></span>
        <div>Shopify ストアで購入<div class="ec-sub">komugi.myshopify.com</div></div>
        <span class="icon ec-arrow" data-icon="external"></span>
      </a>
    </div>

    <p class="section-title">SNS</p>
    <div class="sns-row">
      <a href="#" class="sns-btn" data-demo="Instagramへ移動します（モック）"><span class="icon" data-icon="instagram"></span></a>
      <a href="#" class="sns-btn" data-demo="Xへ移動します（モック）"><span class="icon" data-icon="x_sns"></span></a>
      <a href="#" class="sns-btn" data-demo="公式サイトへ移動します（モック）"><span class="icon" data-icon="globe"></span></a>
    </div>

    <p class="section-title">店内の様子</p>
    <div class="gallery">
      <div class="gallery-item" style="background:linear-gradient(135deg,#e8623d,#f0a25c);">🥖</div>
      <div class="gallery-item" style="background:linear-gradient(135deg,#e0a02c,#f0c46a);">🥐</div>
      <div class="gallery-item" style="background:linear-gradient(135deg,#d2583f,#ec8a76);">🍞</div>
    </div>

    <p class="section-title">お店の情報</p>
    <div class="card">
      <div class="info-row"><span class="label">カテゴリ</span><span class="value">食べもの・パン</span></div>
      <div class="info-row"><span class="label">出店イベント</span><span class="value">春のオンラインマルシェ 2026</span></div>
      <div class="info-row"><span class="label">区画</span><span class="value">B-2 通り沿い</span></div>
    </div>

    <div style="margin-top: 18px;">
      <button class="btn btn-secondary btn-block" data-goto="town-walk.html">
        <span class="icon" data-icon="map"></span> 街マップにもどる
      </button>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="town-walk.html" data-page="town-walk.html"><span class="nav-icon" data-icon="map"></span>街マップ</a>
    <a href="list.html" data-page="list.html"><span class="nav-icon" data-icon="store"></span>お店一覧</a>
    <a href="mypage.html" data-page="mypage.html"><span class="nav-icon" data-icon="user"></span>マイページ</a>
  </nav>
</div>
<script src="../js/app.js"></script>
</body>
</html>
