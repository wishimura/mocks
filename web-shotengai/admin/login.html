<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>運営ログイン | Web商店街</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-mark" style="background:linear-gradient(135deg,#2a3550,#2bb3a3);">管</span>
      <h1>Web商店街 管理</h1>
      <p>運営・店舗オーナー</p>
    </div>

    <form data-login data-login-to="dashboard.html">
      <div class="form-group">
        <label class="form-label">ID</label>
        <input class="form-input" type="text" placeholder="admin" value="admin" />
      </div>
      <div class="form-group">
        <label class="form-label">パスワード</label>
        <input class="form-input" type="password" placeholder="••••••••" value="demo1234" />
      </div>
      <button type="submit" class="btn btn-navy btn-block">管理画面にログイン</button>
    </form>

    <p class="center" style="margin-top: 18px;">
      <a href="../index.html" class="muted" style="font-size: 13px;">← 入口にもどる</a>
    </p>
  </div>
</div>
<script src="../js/app.js"></script>
</body>
</html>
