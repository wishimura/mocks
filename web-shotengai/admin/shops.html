<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>店舗管理 | Web商店街 管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app">
  <div class="header">
    <a href="dashboard.html" class="back"><span class="icon" data-icon="back"></span></a>
    <h1>店舗管理</h1>
    <a href="shop-edit.html" class="header-action"><span class="icon" data-icon="plus"></span> 新規登録</a>
  </div>

  <div class="main">
    <div class="search-bar">
      <span class="search-icon" data-icon="search"></span>
      <input class="form-input" type="text" placeholder="店舗名で検索" data-search-input />
    </div>

    <div class="table-wrap">
      <table class="data">
        <thead>
          <tr><th>店舗</th><th>カテゴリ</th><th>EC連携</th><th>状態</th><th>区画</th><th></th></tr>
        </thead>
        <tbody>
          <tr data-searchable data-name="こむぎベーカリー">
            <td><span class="row-name"><span class="row-em">🍞</span>こむぎベーカリー</span></td>
            <td>食べもの</td><td><span class="badge badge-base">BASE</span></td>
            <td><span class="badge badge-on">公開中</span></td><td>B-2</td>
            <td><a href="shop-edit.html"><span class="icon" data-icon="edit"></span></a></td>
          </tr>
          <tr data-searchable data-name="みどり園芸">
            <td><span class="row-name"><span class="row-em">🌿</span>みどり園芸</span></td>
            <td>雑貨</td><td><span class="badge badge-shopify">Shopify</span></td>
            <td><span class="badge badge-on">公開中</span></td><td>A-5</td>
            <td><a href="shop-edit.html"><span class="icon" data-icon="edit"></span></a></td>
          </tr>
          <tr data-searchable data-name="茶舗やまぐち">
            <td><span class="row-name"><span class="row-em">🫖</span>茶舗やまぐち</span></td>
            <td>飲みもの</td><td><span class="badge badge-base">BASE</span></td>
            <td><span class="badge badge-on">公開中</span></td><td>B-4</td>
            <td><a href="shop-edit.html"><span class="icon" data-icon="edit"></span></a></td>
          </tr>
          <tr data-searchable data-name="革工房ナナ">
            <td><span class="row-name"><span class="row-em">👜</span>革工房ナナ</span></td>
            <td>クラフト</td><td><span class="badge badge-shopify">Shopify</span></td>
            <td><span class="badge badge-off">下書き</span></td><td>—</td>
            <td><a href="shop-edit.html"><span class="icon" data-icon="edit"></span></a></td>
          </tr>
          <tr data-searchable data-name="洋菓子マロン">
            <td><span class="row-name"><span class="row-em">🍰</span>洋菓子マロン</span></td>
            <td>食べもの</td><td><span class="badge badge-base">BASE</span></td>
            <td><span class="badge badge-on">公開中</span></td><td>C-1</td>
            <td><a href="shop-edit.html"><span class="icon" data-icon="edit"></span></a></td>
          </tr>
          <tr data-searchable data-name="海鮮あおい">
            <td><span class="row-name"><span class="row-em">🐟</span>海鮮あおい</span></td>
            <td>食べもの</td><td><span class="badge badge-shopify">Shopify</span></td>
            <td><span class="badge badge-on">公開中</span></td><td>C-3</td>
            <td><a href="shop-edit.html"><span class="icon" data-icon="edit"></span></a></td>
          </tr>
        </tbody>
      </table>
    </div>
    <p class="muted center" style="font-size:12px; margin-top:12px;">42 店舗を表示中（最大 60 店舗）</p>
  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html" data-page="dashboard.html"><span class="nav-icon" data-icon="home"></span>ホーム</a>
    <a href="shops.html" data-page="shops.html"><span class="nav-icon" data-icon="store"></span>店舗</a>
    <a href="layout.html" data-page="layout.html"><span class="nav-icon" data-icon="grid"></span>配置</a>
    <a href="settings.html" data-page="settings.html"><span class="nav-icon" data-icon="settings"></span>設定</a>
  </nav>
</div>
<script src="../js/app.js"></script>
</body>
</html>
