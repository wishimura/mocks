<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ダッシュボード | Web商店街 管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app">
  <div class="header">
    <span class="brand"><span class="brand-mark" style="background:linear-gradient(135deg,#2a3550,#2bb3a3);">管</span> 管理ダッシュボード</span>
    <a href="settings.html" class="back" style="margin-left:auto;"><span class="icon" data-icon="settings"></span></a>
  </div>

  <div class="main">
    <div class="card" style="margin-bottom:16px;">
      <div class="row-split">
        <div>
          <p class="card-title">開催中のイベント</p>
          <p class="card-value" style="font-size:20px;">春のオンラインマルシェ 2026</p>
          <p class="card-sub">2026/04/01 〜 2026/04/14</p>
        </div>
        <span class="badge badge-on"><span class="dot" style="width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block;"></span> 公開中</span>
      </div>
    </div>

    <div class="stats">
      <div class="card"><p class="card-title">登録店舗</p><p class="card-value">42<span style="font-size:13px;font-weight:600;color:var(--text-muted);"> / 60</span></p></div>
      <div class="card"><p class="card-title">公開中</p><p class="card-value">38</p></div>
      <div class="card"><p class="card-title">いま来場中</p><p class="card-value">3</p></div>
      <div class="card"><p class="card-title">本日の来場</p><p class="card-value">126</p></div>
    </div>

    <p class="section-title">クイック操作</p>
    <div class="grid-2">
      <button class="btn btn-block" data-goto="shop-edit.html"><span class="icon" data-icon="plus"></span> 店舗を登録</button>
      <button class="btn btn-navy btn-block" data-goto="layout.html"><span class="icon" data-icon="grid"></span> 配置を変更</button>
    </div>

    <p class="section-title">最近登録された店舗 <a class="more" href="shops.html">すべて見る</a></p>
    <div class="shop-list">
      <a href="shop-edit.html" class="shop-card">
        <div class="shop-thumb" style="--st:linear-gradient(135deg,#e8623d,#f0a25c);">🍞</div>
        <div class="shop-body"><p class="shop-name">こむぎベーカリー</p><p class="shop-cat">食べもの・パン</p>
          <div class="shop-tags"><span class="badge badge-on">公開中</span><span class="badge badge-base">BASE</span></div></div>
        <span class="icon" data-icon="edit" style="color:var(--text-muted);"></span>
      </a>
      <a href="shop-edit.html" class="shop-card">
        <div class="shop-thumb" style="--st:linear-gradient(135deg,#7a5cd6,#a98ee6);">👜</div>
        <div class="shop-body"><p class="shop-name">革工房ナナ</p><p class="shop-cat">クラフト・レザー</p>
          <div class="shop-tags"><span class="badge badge-off">下書き</span><span class="badge badge-shopify">Shopify</span></div></div>
        <span class="icon" data-icon="edit" style="color:var(--text-muted);"></span>
      </a>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="dashboard.html" data-page="dashboard.html"><span class="nav-icon" data-icon="home"></span>ホーム</a>
    <a href="shops.html" data-page="shops.html"><span class="nav-icon" data-icon="store"></span>店舗</a>
    <a href="layout.html" data-page="layout.html"><span class="nav-icon" data-icon="grid"></span>配置</a>
    <a href="settings.html" data-page="settings.html"><span class="nav-icon" data-icon="settings"></span>設定</a>
  </nav>
</div>
<script src="../js/app.js"></script>
</body>
</html>
