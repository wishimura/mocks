<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>卓割 Takuwari | 温泉ホテル レストラン卓割アプリ モック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="login-wrap">
  <div class="role-card">
    <div class="login-logo">
      <span class="logo-mark">卓</span>
      <h1>卓割</h1>
      <p>TAKUWARI · 卓割アプリ</p>
    </div>
    <p class="tagline">PMS データを、卓へ。ドラッグ&ドロップで。</p>

    <a href="user/login.html" class="role-btn">
      <span class="role-icon"><span class="icon" data-icon="utensils"></span></span>
      <div>
        <p class="role-title">レストランスタッフ</p>
        <p class="role-sub">本日の卓割・座席変更・印刷</p>
      </div>
      <span class="role-chevron"><span class="icon" data-icon="chevron"></span></span>
    </a>

    <a href="admin/login.html" class="role-btn">
      <span class="role-icon"><span class="icon" data-icon="shield"></span></span>
      <div>
        <p class="role-title">管理者・支配人</p>
        <p class="role-sub">会場・卓の登録・PMS連携・スタッフ管理</p>
      </div>
      <span class="role-chevron"><span class="icon" data-icon="chevron"></span></span>
    </a>

    <p class="muted center" style="font-size: 11px; margin-top: 22px;">
      ※ これは提案用のHTMLデザインモックです。データ保存はされません。
    </p>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
