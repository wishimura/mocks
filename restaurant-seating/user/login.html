<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ログイン | Citrus Seat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-mark">C</span>
      <h1>Citrus Seat</h1>
      <p>RESTAURANT STAFF</p>
    </div>
    <form data-login data-login-to="board.html">
      <div class="form-group">
        <label class="form-label">スタッフID</label>
        <input class="form-input" type="text" value="staff-suzuki" />
      </div>
      <div class="form-group">
        <label class="form-label">パスワード</label>
        <input class="form-input" type="password" value="••••••••" />
      </div>
      <button class="btn btn-block" type="submit">ログイン</button>
      <p class="muted center" style="font-size: 12px; margin-top: 14px;">
        IDをお忘れの場合は支配人へお問い合わせください
      </p>
    </form>
    <hr class="divider" />
    <a href="../index.html" class="muted" style="font-size: 12px; display: block; text-align: center;">
      ← ロール選択へ戻る
    </a>
  </div>
</div>
<script src="../js/app.js"></script>
</body>
</html>
