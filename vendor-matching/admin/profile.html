<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>店舗情報｜サクラWeb工房</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app">

  <header class="header">
    <h1>店舗情報</h1>
    <button class="header-action" data-demo="公開プレビュー画面を開きます（モック）">公開プレビュー</button>
  </header>

  <main class="main">

    <!-- プロフィール -->
    <div class="card" style="display: flex; gap: 14px; align-items: center;">
      <div class="vendor-logo">サ</div>
      <div style="flex: 1; min-width: 0;">
        <div style="font-weight: 700; font-size: 16px;">サクラWeb工房</div>
        <div class="muted-sm">Web制作・IT / 東京都</div>
        <div class="muted-sm">★ 4.8（32レビュー）</div>
      </div>
      <button class="btn btn-sm btn-secondary" data-demo="ロゴ画像の変更（モック）">編集</button>
    </div>

    <div class="section-title">基本情報</div>
    <div class="card" style="padding: 0;">
      <a href="#" class="info-row" style="padding: 14px 16px; text-decoration: none; color: inherit;" data-demo="会社情報を編集（モック）">
        <div class="info-label">会社情報</div>
        <div class="info-value">株式会社サクラWeb工房 <span style="float: right; color: var(--text-soft);">›</span></div>
      </a>
      <a href="#" class="info-row" style="padding: 14px 16px; text-decoration: none; color: inherit;" data-demo="対応エリアを編集（モック）">
        <div class="info-label">対応エリア</div>
        <div class="info-value">東京・神奈川・埼玉・全国 <span style="float: right; color: var(--text-soft);">›</span></div>
      </a>
      <a href="#" class="info-row" style="padding: 14px 16px; text-decoration: none; color: inherit; border-bottom: none;" data-demo="カテゴリを編集（モック）">
        <div class="info-label">カテゴリ</div>
        <div class="info-value">Web制作・IT <span style="float: right; color: var(--text-soft);">›</span></div>
      </a>
    </div>

    <div class="section-title">掲載コンテンツ</div>
    <div class="card" style="padding: 0;">
      <a href="#" class="info-row" style="padding: 14px 16px; text-decoration: none; color: inherit;" data-demo="サービス一覧の編集（4件）">
        <div class="info-value"><span class="icon" data-icon="tag"></span>　サービス（4件）</div>
      </a>
      <a href="#" class="info-row" style="padding: 14px 16px; text-decoration: none; color: inherit;" data-demo="実績ページの編集（12件）">
        <div class="info-value"><span class="icon" data-icon="briefcase"></span>　実績（12件）</div>
      </a>
      <a href="#" class="info-row" style="padding: 14px 16px; text-decoration: none; color: inherit;" data-demo="レビュー一覧（32件）">
        <div class="info-value"><span class="icon" data-icon="star"></span>　レビュー（32件）</div>
      </a>
      <a href="#" class="info-row" style="padding: 14px 16px; text-decoration: none; color: inherit; border-bottom: none;" data-demo="料金目安の編集（モック）">
        <div class="info-value"><span class="icon" data-icon="yen"></span>　料金目安</div>
      </a>
    </div>

    <div class="section-title">設定</div>
    <div class="card" style="padding: 0;">
      <a href="#" class="info-row" style="padding: 14px 16px; text-decoration: none; color: inherit;" data-demo="通知設定（モック）">
        <div class="info-value"><span class="icon" data-icon="bell"></span>　通知設定</div>
      </a>
      <a href="#" class="info-row" style="padding: 14px 16px; text-decoration: none; color: inherit;" data-demo="自動返信メッセージの設定（モック）">
        <div class="info-value"><span class="icon" data-icon="settings"></span>　自動返信メッセージ</div>
      </a>
      <a href="../index.html" class="info-row" style="padding: 14px 16px; text-decoration: none; color: var(--danger); border-bottom: none;">
        <div class="info-value"><span class="icon" data-icon="logout"></span>　ログアウト</div>
      </a>
    </div>

  </main>

  <nav class="bottom-nav">
    <a href="dashboard.html" data-page="dashboard.html">
      <span class="nav-icon icon" data-icon="home"></span>
      ホーム
    </a>
    <a href="inquiries.html" data-page="inquiries.html">
      <span class="nav-icon icon" data-icon="mail"></span>
      問い合わせ
    </a>
    <a href="chats.html" data-page="chats.html">
      <span class="nav-icon icon" data-icon="chat"></span>
      チャット
    </a>
    <a href="profile.html" data-page="profile.html">
      <span class="nav-icon icon" data-icon="building"></span>
      店舗情報
    </a>
  </nav>

</div>
<script src="../js/app.js"></script>
</body>
</html>
