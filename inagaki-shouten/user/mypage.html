<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>マイページ｜稲垣商店 業務システム</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app">
<div class="app-body">

  <header class="header">
    <h1>マイページ</h1>
    <span style="width:40px;"></span>
  </header>

  <main class="main">

    <div class="profile-head">
      <div class="profile-avatar">石</div>
      <div>
        <div class="profile-name">石村 渡</div>
        <div class="profile-role">営業部 ／ 社員ID：ST-1024</div>
      </div>
    </div>

    <section>
      <div class="section-title">設定</div>
      <div class="card" style="padding:4px 12px;">
        <button type="button" class="list-row" data-demo="通知設定画面を開きます（デモ）">
          <span class="row-icon" data-icon="bell"></span>
          <span class="row-body"><span class="row-title">通知設定</span></span>
          <span class="chevron icon-sm" data-icon="chevron"></span>
        </button>
        <button type="button" class="list-row" data-demo="アカウント情報の編集画面を開きます（デモ）">
          <span class="row-icon" data-icon="user"></span>
          <span class="row-body"><span class="row-title">アカウント情報</span></span>
          <span class="chevron icon-sm" data-icon="chevron"></span>
        </button>
        <button type="button" class="list-row" data-demo="ヘルプ・お問い合わせ画面を開きます（デモ）">
          <span class="row-icon" data-icon="info"></span>
          <span class="row-body"><span class="row-title">ヘルプ・お問い合わせ</span></span>
          <span class="chevron icon-sm" data-icon="chevron"></span>
        </button>
      </div>
    </section>

    <a href="../index.html" class="btn btn-danger btn-block" style="margin-top:20px;">
      <span class="icon-sm" data-icon="logout"></span>ログアウト
    </a>

  </main>

  <nav class="bottom-nav">
    <a href="home.html" data-page="home.html"><span class="nav-icon" data-icon="home"></span>ホーム</a>
    <a href="pricing.html" data-page="pricing.html"><span class="nav-icon" data-icon="calculator"></span>価格算出</a>
    <a href="freight.html" data-page="freight.html"><span class="nav-icon" data-icon="truck"></span>運賃算出</a>
    <a href="inventory.html" data-page="inventory.html"><span class="nav-icon" data-icon="layers"></span>在庫</a>
    <a href="mypage.html" data-page="mypage.html"><span class="nav-icon" data-icon="user"></span>マイページ</a>
  </nav>

</div>
</div>
<script src="../js/app.js"></script>
</body>
</html>
