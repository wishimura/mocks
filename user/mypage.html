<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>マイページ | イベント</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app">
  <header class="header">
    <h1>マイページ</h1>
  </header>

  <main class="main">
    <div class="card" style="text-align: center;">
      <div style="width: 72px; height: 72px; background: var(--primary-light); color: var(--primary); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 8px;">
        <span class="icon icon-2xl" data-icon="user"></span>
      </div>
      <h2 style="margin: 0; font-size: 18px;">山田 太郎</h2>
      <p class="muted" style="margin: 4px 0 0; font-size: 14px;">user@example.com</p>
    </div>

    <div class="stats" style="grid-template-columns: repeat(3, 1fr); margin-top: 12px;">
      <div class="card">
        <p class="card-title">参加予定</p>
        <p class="card-value" style="font-size: 22px;">2</p>
      </div>
      <div class="card">
        <p class="card-title">参加回数</p>
        <p class="card-value" style="font-size: 22px;">8</p>
      </div>
      <div class="card">
        <p class="card-title">今年の支払</p>
        <p class="card-value" style="font-size: 18px;">¥13,000</p>
      </div>
    </div>

    <h2 class="section-title">設定</h2>
    <div class="item-list">
      <a href="#" class="applicant-row">
        <div class="applicant-info"><div class="applicant-name"><span class="icon" data-icon="user"></span> プロフィール編集</div></div>
        <span class="icon" data-icon="chevron"></span>
      </a>
      <a href="#" class="applicant-row">
        <div class="applicant-info"><div class="applicant-name"><span class="icon" data-icon="lock"></span> パスワード変更</div></div>
        <span class="icon" data-icon="chevron"></span>
      </a>
      <a href="#" class="applicant-row">
        <div class="applicant-info"><div class="applicant-name"><span class="icon" data-icon="bell"></span> 通知設定</div></div>
        <span class="icon" data-icon="chevron"></span>
      </a>
      <a href="#" class="applicant-row">
        <div class="applicant-info"><div class="applicant-name"><span class="icon" data-icon="help"></span> ヘルプ・よくある質問</div></div>
        <span class="icon" data-icon="chevron"></span>
      </a>
    </div>

    <div style="margin-top: 16px;">
      <a href="login.html" class="btn btn-secondary btn-block"><span class="icon" data-icon="logout"></span>ログアウト</a>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="events.html" data-page="events.html"><span class="nav-icon" data-icon="home"></span>ホーム</a>
    <a href="my-events.html" data-page="my-events.html"><span class="nav-icon" data-icon="calendar"></span>申込履歴</a>
    <a href="ticket.html" data-page="ticket.html"><span class="nav-icon" data-icon="ticket"></span>チケット</a>
    <a href="receipts.html" data-page="receipts.html"><span class="nav-icon" data-icon="receipt"></span>支払い</a>
    <a href="mypage.html" data-page="mypage.html"><span class="nav-icon" data-icon="user"></span>マイページ</a>
  </nav>
</div>
<script src="../js/app.js"></script>
</body>
</html>
