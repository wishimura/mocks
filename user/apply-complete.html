<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>申込完了 | イベント</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app">
  <header class="header">
    <h1>申込完了</h1>
  </header>

  <main class="main">
    <div class="card" style="text-align: center; padding: 32px 20px;">
      <div style="width: 72px; height: 72px; background: #d1fae5; color: #065f46; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px;">
        <span class="icon icon-2xl" data-icon="check"></span>
      </div>
      <h2 style="margin: 0 0 6px; font-size: 20px;">申込が完了しました</h2>
      <p class="muted" style="margin: 0; font-size: 14px;">確認メールをお送りしました</p>
    </div>

    <div class="card" style="margin-top: 12px;">
      <h3 style="margin: 0 0 8px; font-size: 16px;">春の交流会 2026</h3>
      <div style="display: flex; flex-direction: column; gap: 8px; font-size: 14px;">
        <div><span class="icon" data-icon="calendar"></span> 2026/04/28 (火) 14:00</div>
        <div><span class="icon" data-icon="location"></span> 市民会館 3F</div>
        <div><span class="icon" data-icon="yen"></span> 3,000円（当日会場にて）</div>
      </div>
    </div>

    <div style="margin-top: 16px; display: grid; gap: 12px;">
      <a href="ticket.html" class="btn"><span class="icon" data-icon="ticket"></span>当日チケットを見る</a>
      <a href="events.html" class="btn btn-secondary">他のイベントを探す</a>
    </div>
  </main>
</div>
<script src="../js/app.js"></script>
</body>
</html>
