<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hale Kotsubo｜宿泊一元管理システム モック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<style>
  .role-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
      radial-gradient(ellipse 70% 50% at 50% 0%, #cfe2e0 0%, transparent 60%),
      radial-gradient(ellipse 70% 50% at 50% 100%, #f0e2cf 0%, transparent 60%),
      var(--bg);
  }
  .role-card {
    background: #fff;
    border-radius: 22px;
    padding: 38px 30px;
    width: 100%;
    max-width: 430px;
    box-shadow: var(--shadow-lg);
  }
  .role-btn {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 18px 18px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text);
    width: 100%;
    text-align: left;
    transition: border-color 0.15s, background 0.15s;
    text-decoration: none;
  }
  .role-btn:hover { border-color: var(--primary); background: var(--primary-light); text-decoration: none; }
  .role-btn + .role-btn { margin-top: 12px; }
  .role-icon {
    width: 46px;
    height: 46px;
    border-radius: 13px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--primary-light);
    color: var(--primary);
    flex-shrink: 0;
  }
  .role-icon.accent { background: var(--accent-light); color: var(--accent-dark); }
  .role-icon .icon { width: 23px; height: 23px; }
  .role-title { margin: 0; font-size: 15px; font-weight: 600; }
  .role-sub { margin: 2px 0 0; font-size: 12px; color: var(--text-muted); }
  .role-chevron { margin-left: auto; color: var(--text-muted); }
  .tagline {
    text-align: center;
    font-size: 11px;
    letter-spacing: 0.16em;
    color: var(--text-muted);
    margin: 0 0 24px;
  }
</style>
</head>
<body>
<div class="role-wrap">
  <div class="role-card">
    <div class="login-logo">
      <span class="logo-mark"><span class="icon" data-icon="waves"></span></span>
      <h1>Hale Kotsubo</h1>
      <p>ZUSHI · KOTSUBO PRIVATE VILLA</p>
    </div>
    <p class="tagline">海辺の一棟貸しヴィラ ─ 宿泊一元管理システム</p>

    <a href="user/login.html" class="role-btn">
      <span class="role-icon accent"><span class="icon" data-icon="key"></span></span>
      <div>
        <p class="role-title">宿泊をご検討のお客さま</p>
        <p class="role-sub">空室確認・お見積り依頼・ご予約状況</p>
      </div>
      <span class="role-chevron"><span class="icon" data-icon="chevron"></span></span>
    </a>

    <a href="admin/login.html" class="role-btn">
      <span class="role-icon"><span class="icon" data-icon="shield"></span></span>
      <div>
        <p class="role-title">運営スタッフ用 管理システム</p>
        <p class="role-sub">問い合わせ管理・宿泊者名簿・見積り計算・売上分析</p>
      </div>
      <span class="role-chevron"><span class="icon" data-icon="chevron"></span></span>
    </a>

    <p class="muted center" style="font-size: 11px; margin-top: 24px;">
      ※ これは提案用のHTMLデザインモックです（DB接続なし）
    </p>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
