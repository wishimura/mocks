<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>スタッフログイン｜Hale Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Serif+JP:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-mark"><span class="icon" data-icon="compass"></span></span>
      <h1>Hale Board</h1>
      <p>STAFF · 宿泊一元管理</p>
    </div>

    <form data-login data-login-to="dashboard.html">
      <div class="form-group">
        <label class="form-label">スタッフID</label>
        <input type="text" class="form-input" value="manager@hale-kotsubo.example" />
      </div>
      <div class="form-group">
        <label class="form-label">パスワード</label>
        <input type="password" class="form-input" value="••••••••" />
      </div>
      <button type="submit" class="btn btn-block">ログイン</button>
    </form>

    <p class="center" style="margin-top: 16px;">
      <a href="../index.html" style="font-size: 12px; color: var(--text-muted);">← 入口に戻る</a>
    </p>
  </div>
</div>
<script src="../js/app.js"></script>
</body>
</html>
