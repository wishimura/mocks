<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CareerBridge｜転職エージェント業務支援システム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="role-card">
    <div class="auth-logo">
      <span class="brand-mark">転</span>
      <h1>CareerBridge</h1>
      <p>転職エージェント業務支援システム</p>
    </div>
    <p class="center muted text-sm" style="margin-bottom:22px;">
      求人ボックスからの問い合わせ取込 → 架電・アポ → 面談 → 追客 → 書類選考まで、<br>転職支援の流れをひとつの画面で管理します。
    </p>

    <a href="user/login.html" class="role-btn">
      <span class="role-icon"><span class="icon" data-icon="userCheck"></span></span>
      <div>
        <p class="role-title">エージェント（担当者）</p>
        <p class="role-sub">候補者の管理・架電・面談・追客・書類選考</p>
      </div>
      <span class="role-chevron"><span class="icon" data-icon="chevron"></span></span>
    </a>

    <a href="admin/login.html" class="role-btn">
      <span class="role-icon accent"><span class="icon" data-icon="layers"></span></span>
      <div>
        <p class="role-title">マネージャー（管理者）</p>
        <p class="role-sub">チームのKPI・同席依頼・メンバー・設定</p>
      </div>
      <span class="role-chevron"><span class="icon" data-icon="chevron"></span></span>
    </a>

    <p class="muted center text-xs" style="margin-top:22px;">
      ※ 要件整理用のデザインサンプルです（DB接続なし・データはダミー）
    </p>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
