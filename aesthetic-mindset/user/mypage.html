<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>マイページ | 美的マインドセット診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand">
      <span class="brand-mark">美</span>
      <span>マイページ</span>
    </div>
  </header>

  <main class="main">
    <div class="card center">
      <span class="logo-mark" style="background:var(--accent-light); color:var(--accent-deep);">佐</span>
      <p class="serif" style="font-size: 18px; color: var(--ink); margin-top: 4px;">佐倉 美雪</p>
      <p class="muted" style="font-size: 12px;">miyuki.art@example.com</p>
      <div class="hero-stats" style="margin-top: 18px;">
        <div style="background: var(--paper-deep); border-color: var(--border); color: var(--text);">
          <p class="hero-stat-value" style="color: var(--ink);">3</p>
          <p class="hero-stat-label" style="color: var(--text-muted); opacity:1;">受診回数</p>
        </div>
        <div style="background: var(--paper-deep); border-color: var(--border); color: var(--text);">
          <p class="hero-stat-value" style="color: var(--ink);">3.9</p>
          <p class="hero-stat-label" style="color: var(--text-muted); opacity:1;">最新の総合点</p>
        </div>
        <div style="background: var(--paper-deep); border-color: var(--border); color: var(--text);">
          <p class="hero-stat-value" style="color: var(--ink);">震</p>
          <p class="hero-stat-label" style="color: var(--text-muted); opacity:1;">深く震える人</p>
        </div>
      </div>
    </div>

    <h2 class="section-title">プロフィール</h2>
    <div class="card">
      <div class="field">
        <label class="label" for="name">お名前</label>
        <input class="input" id="name" type="text" value="佐倉 美雪" />
      </div>
      <div class="field">
        <label class="label" for="age">年代</label>
        <select class="select" id="age">
          <option>20代</option>
          <option selected>30代</option>
          <option>40代</option>
          <option>50代</option>
          <option>60代以上</option>
        </select>
      </div>
      <div class="field">
        <label class="label" for="interest">関心のあるジャンル</label>
        <select class="select" id="interest">
          <option selected>音楽・舞台</option>
          <option>絵画・彫刻</option>
          <option>建築・デザイン</option>
          <option>文芸・詩</option>
          <option>映像・デジタルアート</option>
        </select>
      </div>
      <button class="btn btn-block" data-demo="プロフィールを保存しました（モック）">保存する</button>
    </div>

    <h2 class="section-title">通知</h2>
    <div class="card">
      <div class="setting-row">
        <div class="grow">
          <p class="setting-title">再受診のリマインド</p>
          <p class="setting-desc">3か月ごとにメールでお知らせします。</p>
        </div>
        <label class="toggle"><input type="checkbox" checked /><span class="toggle-track"></span></label>
      </div>
      <div class="setting-row">
        <div class="grow">
          <p class="setting-title">おすすめの体験情報</p>
          <p class="setting-desc">スコアに合わせた展示・ワークショップのご案内。</p>
        </div>
        <label class="toggle"><input type="checkbox" checked /><span class="toggle-track"></span></label>
      </div>
      <div class="setting-row">
        <div class="grow">
          <p class="setting-title">結果の匿名提供</p>
          <p class="setting-desc">統計データとして匿名で集計に使用することに同意する。</p>
        </div>
        <label class="toggle"><input type="checkbox" /><span class="toggle-track"></span></label>
      </div>
    </div>

    <h2 class="section-title">その他</h2>
    <div class="stack">
      <a href="history.html" class="list-item">
        <div class="row-split">
          <p class="item-title">受診履歴</p>
          <span class="icon" data-icon="chevron" style="color:var(--text-muted)"></span>
        </div>
      </a>
      <a href="#" class="list-item" data-demo="このテストについての解説ページを表示します（モック）">
        <div class="row-split">
          <p class="item-title">このテストについて</p>
          <span class="icon" data-icon="chevron" style="color:var(--text-muted)"></span>
        </div>
      </a>
      <a href="../index.html" class="list-item">
        <div class="row-split">
          <p class="item-title" style="color: var(--danger);">ログアウト</p>
          <span class="icon" data-icon="logout" style="color:var(--danger)"></span>
        </div>
      </a>
    </div>

    <p class="mock-note">HTMLモック（提案用）</p>
  </main>

  <nav class="bottom-nav">
    <a href="home.html" data-page="home.html"><span class="nav-icon" data-icon="home"></span>ホーム</a>
    <a href="test.html" data-page="test.html"><span class="nav-icon" data-icon="palette"></span>診断</a>
    <a href="history.html" data-page="history.html"><span class="nav-icon" data-icon="history"></span>履歴</a>
    <a href="recommend.html" data-page="recommend.html"><span class="nav-icon" data-icon="compass"></span>おすすめ</a>
    <a href="mypage.html" data-page="mypage.html"><span class="nav-icon" data-icon="user"></span>マイページ</a>
  </nav>
</div>
<script src="../js/app.js"></script>
</body>
</html>
