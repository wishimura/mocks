<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ログイン | 美的マインドセット診断</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-mark">美</span>
      <h1>美的マインドセット診断</h1>
      <p>AESTHETIC MINDSET TEST</p>
    </div>

    <form data-login data-login-to="home.html">
      <div class="field">
        <label class="label" for="email">メールアドレス</label>
        <input class="input" id="email" type="email" value="miyuki.art@example.com" />
      </div>
      <div class="field">
        <label class="label" for="pw">パスワード</label>
        <input class="input" id="pw" type="password" value="demo1234" />
      </div>
      <button class="btn btn-block" type="submit">ログイン</button>
    </form>

    <div style="margin-top: 12px;">
      <button class="btn btn-secondary btn-block" data-goto="test.html">
        <span class="icon" data-icon="sparkle"></span>
        登録せずに診断だけ試す
      </button>
    </div>

    <p class="center" style="margin-top: 18px;">
      <a href="../index.html" style="font-size: 12px;">← ロール選択にもどる</a>
    </p>
  </div>
</div>
<script src="../js/app.js"></script>
</body>
</html>
