<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>美的マインドセット診断 | モック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="role-wrap">
  <div class="role-card">
    <div class="login-logo">
      <span class="logo-mark">美</span>
      <h1>美的マインドセット診断</h1>
      <p>AESTHETIC MINDSET TEST</p>
    </div>
    <p class="tagline">生活にアートを取り入れる</p>

    <a href="user/login.html" class="role-btn">
      <span class="role-icon"><span class="icon" data-icon="palette"></span></span>
      <div>
        <p class="role-title">診断を受ける方</p>
        <p class="role-sub">14項目・約3分／結果とアドバイスを表示</p>
      </div>
      <span class="role-chevron"><span class="icon" data-icon="chevron"></span></span>
    </a>

    <a href="admin/login.html" class="role-btn">
      <span class="role-icon"><span class="icon" data-icon="shield"></span></span>
      <div>
        <p class="role-title">運営・管理者の方</p>
        <p class="role-sub">受診状況・スコア分布・設問管理</p>
      </div>
      <span class="role-chevron"><span class="icon" data-icon="chevron"></span></span>
    </a>

    <div class="note" style="margin-top: 22px;">
      <span class="icon" data-icon="info"></span>
      <div>
        14項目に5段階で答えると、<b>美的理解力 / 強力な美的経験 / 創造的行動</b> の3カテゴリ別スコアと総合点が出ます。採点はブラウザ内で完結します。
      </div>
    </div>

    <p class="muted center" style="font-size: 11px; margin-top: 18px;">
      ※ これは提案用のHTMLデザインモックです
    </p>
  </div>
</div>
<script src="js/app.js"></script>
