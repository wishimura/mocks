<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>投稿を受け付けました | コエノワ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Zen+Old+Mincho:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="home.html" class="brand"><span class="brand-mark">声</span><span>コエノワ</span></a>
      <div class="spacer"></div>
      <nav class="nav-links">
        <a href="home.html" data-page="home.html">ホーム</a>
        <a href="search.html" data-page="search.html">さがす</a>
        <a href="ranking.html" data-page="ranking.html">ランキング</a>
        <a href="post.html" data-page="post.html">体験談を投稿</a>
        <a href="mypage.html" data-page="mypage.html">マイページ</a>
      </nav>
      <a href="search.html" class="icon-btn"><span class="icon icon-lg" data-icon="search"></span></a>
    </div>
  </header>
<div class="site">
  <main class="main">
    <div class="card center" style="padding:34px 20px;">
      <span class="role-icon" style="margin:0 auto 14px;width:64px;height:64px;border-radius:20px;"><span class="icon icon-xl" data-icon="checkCircle"></span></span>
      <h1 class="page-title">投稿を受け付けました</h1>
      <p class="text-sm muted mt-sm">運営が内容を確認しています。公開されるとメールでお知らせします。</p>

      <div class="steps mt-lg">
        <div class="step done"><span class="step-dot"><span class="icon" data-icon="check"></span></span>投稿</div>
        <div class="step now"><span class="step-dot">2</span>運営確認</div>
        <div class="step"><span class="step-dot">3</span>公開</div>
      </div>

      <div class="notice info mt">
        <span class="icon" data-icon="info"></span>
        <div>確認の目安は1〜2営業日です。内容の一部を運営が編集する場合があります（意味が変わる修正は事前にご連絡します）。</div>
      </div>

      <div class="wrap-gap mt-lg" style="justify-content:center;">
        <a href="mypage.html" class="btn"><span class="icon" data-icon="user"></span>投稿の状況を見る</a>
        <a href="home.html" class="btn btn-secondary">トップに戻る</a>
      </div>
    </div>

    <h2 class="section-title"><span class="icon" data-icon="doc"></span>公開までの間に読まれています</h2>
    <div class="stack">
      <a href="article.html" class="post">
        <span class="post-thumb g1"><span class="icon icon-lg" data-icon="doc"></span></span>
        <div class="post-body">
          <div class="wrap-gap mb-sm"><span class="badge badge-official">運営記事</span></div>
          <p class="post-title">「体験談を書く」だけで、だれかの背中を押せる理由</p>
          <div class="post-meta"><span><span class="icon" data-icon="eye"></span> 4,812</span></div>
        </div>
      </a>
    </div>
  </main>
  <nav class="bottom-nav">
    <a href="home.html" data-page="home.html"><span class="nav-icon icon" data-icon="home"></span>ホーム</a>
    <a href="search.html" data-page="search.html"><span class="nav-icon icon" data-icon="search"></span>さがす</a>
    <a href="ranking.html" data-page="ranking.html"><span class="nav-icon icon" data-icon="crown"></span>ランキング</a>
    <a href="post.html" data-page="post.html"><span class="nav-icon icon" data-icon="pen"></span>投稿</a>
    <a href="mypage.html" data-page="mypage.html"><span class="nav-icon icon" data-icon="user"></span>マイページ</a>
  </nav>
</div>
<script src="../js/app.js"></script>
</body>
</html>
