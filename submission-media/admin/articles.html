<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>記事の掲載管理 | コエノワ 管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Zen+Old+Mincho:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body class="admin">
  <header class="header">
    <div class="header-inner">
      <a href="dashboard.html" class="brand"><span class="brand-mark">声</span><span>コエノワ 管理</span></a>
      <div class="spacer"></div>
      <nav class="nav-links">
        <a href="dashboard.html" data-page="dashboard.html">ダッシュボード</a>
        <a href="submissions.html" data-page="submissions.html">投稿の承認</a>
        <a href="articles.html" data-page="articles.html">記事</a>
        <a href="members.html" data-page="members.html">会員</a>
        <a href="polls.html" data-page="polls.html">アンケート</a>
        <a href="settings.html" data-page="settings.html">設定</a>
      </nav>
      <a href="../user/home.html" class="icon-btn" title="公開サイトを見る"><span class="icon icon-lg" data-icon="eye"></span></a>
    </div>
  </header>
<div class="site">
  <main class="main">
    <div class="row-split">
      <div>
        <h1 class="page-title">記事の掲載管理</h1>
        <p class="page-sub">運営側が発信する記事・特集の一覧</p>
      </div>
      <a href="article-edit.html" class="btn"><span class="icon" data-icon="plus"></span>新しい記事を書く</a>
    </div>

    <div class="search-box mt">
      <span class="icon" data-icon="search"></span>
      <input type="search" class="form-input" placeholder="タイトルで検索" data-search-input />
    </div>

    <div class="chips mt" data-filter-group>
      <button class="chip active" data-filter="all">すべて</button>
      <button class="chip" data-filter="pub">公開中</button>
      <button class="chip" data-filter="draft">下書き</button>
    </div>

    <div class="table-wrap mt">
      <table class="table">
        <thead><tr><th>状態</th><th>タイトル</th><th>カテゴリー</th><th class="num">PV</th><th>更新日</th><th></th></tr></thead>
        <tbody>
          <tr data-filterable data-searchable data-cat="pub" data-name="体験談を書くだけで だれかの背中を押せる理由">
            <td><span class="badge badge-ok">公開中</span></td>
            <td>「体験談を書く」だけで、だれかの背中を押せる理由</td>
            <td>はじめての方へ</td><td class="num">4,812</td><td>08.14</td>
            <td><a href="article-edit.html" class="btn btn-secondary btn-sm">編集</a></td>
          </tr>
          <tr data-filterable data-searchable data-cat="pub" data-name="転職1年目にやっておきたい記録の残し方">
            <td><span class="badge badge-ok">公開中</span></td>
            <td>転職1年目にやっておきたい記録の残し方</td>
            <td>しごと</td><td class="num">2,140</td><td>08.09</td>
            <td><a href="article-edit.html" class="btn btn-secondary btn-sm">編集</a></td>
          </tr>
          <tr data-filterable data-searchable data-cat="pub" data-name="投稿ガイドライン">
            <td><span class="badge badge-ok">公開中</span></td>
            <td>投稿ガイドライン（掲載できない内容について）</td>
            <td>お知らせ</td><td class="num">1,022</td><td>07.30</td>
            <td><a href="article-edit.html" class="btn btn-secondary btn-sm">編集</a></td>
          </tr>
          <tr data-filterable data-searchable data-cat="draft" data-name="9月の特集 はたらき方を変えた人たち 下書き">
            <td><span class="badge badge-light">下書き</span></td>
            <td>【9月特集】はたらき方を変えた人たち</td>
            <td>特集</td><td class="num">—</td><td>08.17</td>
            <td><a href="article-edit.html" class="btn btn-secondary btn-sm">編集</a></td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
  <nav class="bottom-nav">
    <a href="dashboard.html" data-page="dashboard.html"><span class="nav-icon icon" data-icon="chart"></span>ホーム</a>
    <a href="submissions.html" data-page="submissions.html"><span class="nav-icon icon" data-icon="check"></span>承認</a>
    <a href="articles.html" data-page="articles.html"><span class="nav-icon icon" data-icon="doc"></span>記事</a>
    <a href="members.html" data-page="members.html"><span class="nav-icon icon" data-icon="users"></span>会員</a>
    <a href="settings.html" data-page="settings.html"><span class="nav-icon icon" data-icon="settings"></span>設定</a>
  </nav>
</div>
<script src="../js/app.js"></script>
</body>
</html>
