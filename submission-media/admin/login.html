<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>運営ログイン | コエノワ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Zen+Old+Mincho:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body class="admin">
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="brand-mark">声</span>
      <h1>コエノワ 管理画面</h1>
      <p>ADMIN LOGIN</p>
    </div>
    <form data-login data-login-to="dashboard.html">
      <div class="form-group">
        <label class="form-label">管理者ID（メールアドレス）</label>
        <input type="email" class="form-input" value="editor@koenowa.example.jp" />
      </div>
      <div class="form-group">
        <label class="form-label">パスワード</label>
        <input type="password" class="form-input" value="passwordsample" />
      </div>
      <button type="submit" class="btn btn-block btn-lg"><span class="icon" data-icon="shield"></span>ログイン</button>
    </form>
    <p class="center text-xs muted mt">※ 権限（編集部 / モデレーター）は設定画面で切り替える想定です</p>
    <p class="center mt"><a href="../index.html" class="back-link"><span class="icon" data-icon="back"></span>入口に戻る</a></p>
  </div>
</div>
<script src="../js/app.js"></script>
</body>
</html>
