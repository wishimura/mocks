<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>はじめる | 5年 漢字テスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="landing">
  <div class="landing-hero">
    <div class="big-kanji"><span>漢</span><span>字</span></div>
    <h1>5年 漢字テスト<br>1学期・2学期（光村図書 準拠）</h1>
    <p class="lead">『国語五 銀河』の新出漢字（1学期 86字・2学期 50字）を、<br>読み・漢字えらび・手書きの3つの形式でテストできます。</p>
  </div>
  <div class="stack">
    <a class="role-card red" href="user/login.html">
      <span class="role-icon"><span class="icon icon-xl" data-icon="child"></span></span>
      <div><h2>児童として はじめる</h2><p>テストをする・漢字表・にがての練習</p></div>
      <span class="chev icon" data-icon="chevron"></span>
    </a>
    <a class="role-card" href="admin/login.html">
      <span class="role-icon"><span class="icon icon-xl" data-icon="teacher"></span></span>
      <div><h2>先生として はじめる</h2><p>テスト配信・クラスの正答率・児童ごとのにがて</p></div>
      <span class="chev icon" data-icon="chevron"></span>
    </a>
  </div>
  <p class="note mt">※ 出題範囲は光村図書『国語五 銀河』（令和6年度版）の新出漢字の順番に合わせ、1学期は7つ、2学期は5つのまとまりに分けています。メニューで1学期／2学期を切りかえられます。学校の進度に合わせて範囲をえらべます。記録はこの端末のブラウザにだけ保存されます（モック）。</p>
</div>
<script src="js/app.js"></script>
</body>
</html>
