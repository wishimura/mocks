<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>先生ログイン | 5年 漢字テスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body class="admin-body">
<div class="landing">
  <div class="landing-hero">
    <div class="big-kanji"><span>漢</span><span>字</span></div>
    <h1>先生用ログイン</h1>
    <p class="lead">クラスの漢字テストの進みぐあいを確認できます</p>
  </div>
  <form class="card" data-login data-login-to="dashboard.html">
    <div class="field"><label for="id">先生ID</label><input id="id" class="input" value="teacher@example.ed.jp" /></div>
    <div class="field"><label for="pw">パスワード</label><input id="pw" class="input" type="password" value="password" /></div>
    <button class="btn btn-block btn-lg" type="submit">ログイン</button>
  </form>
  <p class="muted small mt" style="text-align:center"><a href="../index.html">← もどる</a></p>
</div>
<script src="../js/app.js"></script>
</body>
</html>
