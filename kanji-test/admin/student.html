<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="../css/style.css" />
</head>
<body class="admin-body" data-page="adminStudent">
<div class="admin-layout">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">漢</span><span>漢字テスト<small>先生用・5年1組</small></span></div>
    <a href="dashboard.html" data-page="dashboard.html"><span class="icon" data-icon="chart"></span>ダッシュボード</a>
    <a href="assign.html" data-page="assign.html"><span class="icon" data-icon="send"></span>テストを配信</a>
    <a href="students.html" data-page="students.html,student.html"><span class="icon" data-icon="users"></span>児童一覧</a>
    <a href="kanji-stats.html" data-page="kanji-stats.html"><span class="icon" data-icon="grid"></span>漢字別の正答率</a>
    <a href="../index.html"><span class="icon" data-icon="logout"></span>ログアウト</a>
    <div class="side-foot">光村図書『国語五 銀河』<br>1・2学期の新出漢字 136字</div>
  </aside>
  <main class="admin-main">
    <header class="header admin-mobile-head">
      <a class="brand" href="dashboard.html"><span class="brand-mark">漢</span><span>漢字テスト<small>先生用・5年1組</small></span></a>
      <div class="header-spacer"></div>
      <a class="icon-btn" href="../index.html" aria-label="ログアウト"><span class="icon" data-icon="logout"></span></a>
    </header>
    <div class="admin-head">
      <a class="icon-btn" href="students.html" aria-label="もどる"><span class="icon" data-icon="back"></span></a>
      <h1 id="s-name"></h1><div class="spacer"></div>
      <button class="btn btn-red" data-demo="にがての漢字だけのテストを、この児童に配信しました（モック）"><span class="icon" data-icon="send"></span>にがてテストを送る</button>
    </div>
    <div class="kpis" id="s-kpis"></div>
    <div class="admin-grid">
      <div class="card"><p class="card-title"><span class="icon" data-icon="chart"></span>まとまりごとの正答率</p><div id="s-units"></div></div>
      <div class="card"><p class="card-title"><span class="icon" data-icon="target"></span>にがての漢字</p><div class="answer-list" id="s-weak"></div></div>
    </div>
  </main>
</div>
  <nav class="bottom-nav">
    <a href="dashboard.html" data-page="dashboard.html"><span class="nav-icon icon" data-icon="chart"></span>ホーム</a>

  </nav>
