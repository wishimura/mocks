<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ダッシュボード（先生用） | 5年 漢字テスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body class="admin-body" data-page="adminDashboard">
<div class="admin-layout">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">漢</span><span>漢字テスト<small>先生用・5年1組</small></span></div>
    <a href="dashboard.html" data-page="dashboard.html"><span class="icon" data-icon="chart"></span>ダッシュボード</a>
    <a href="assign.html" data-page="assign.html"><span class="icon" data-icon="send"></span>テストを配信</a>
    <a href="students.html" data-page="students.html,student.html"><span class="icon" data-icon="users"></span>児童一覧</a>
    <a href="kanji-stats.html" data-page="kanji-stats.html"><span class="icon" data-icon="grid"></span>漢字別の正答率</a>
    <a href="../index.html"><span class="icon" data-icon="logout"></span>ログアウト</a>
    <div class="side-foot">光村図書『国語五 銀河』<br>1学期の新出漢字 86字</div>
  </aside>
  <main class="admin-main">
    <header class="header admin-mobile-head">
      <a class="brand" href="dashboard.html"><span class="brand-mark">漢</span><span>漢字テスト<small>先生用・5年1組</small></span></a>
      <div class="header-spacer"></div>
      <a class="icon-btn" href="../index.html" aria-label="ログアウト"><span class="icon" data-icon="logout"></span></a>
    </header>
    <div class="admin-head">
      <div><h1>5年1組 ダッシュボード</h1><p class="muted small">配信中：1学期まとめテスト（まとまり⑤〜⑦・読み）</p></div>
      <div class="spacer"></div>
      <a class="btn" href="assign.html"><span class="icon" data-icon="send"></span>テストを配信</a>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="admin-grid">
      <div class="card">
        <p class="card-title"><span class="icon" data-icon="chart"></span>まとまりごとのクラス正答率</p>
        <div id="unit-bars"></div>
        <p class="muted small">70%未満は赤で表示しています。</p>
      </div>
      <div class="card">
        <p class="card-title"><span class="icon" data-icon="flame"></span>まちがいが多い漢字</p>
        <div class="weak-kanji" id="weak-kanji"></div>
        <a class="section-link" style="display:block;text-align:right" href="kanji-stats.html">すべての漢字を見る →</a>
      </div>
    </div>
    <h2 class="section-title"><span class="icon" data-icon="users"></span>配信中テストの提出状況
      <a class="section-link" href="students.html">児童一覧 →</a></h2>
    <div class="table-wrap">
      <table class="table"><thead><tr><th>番号</th><th>名前</th><th>提出</th><th>点数</th></tr></thead><tbody id="recent"></tbody></table>
    </div>
  </main>
</div>
  <nav class="bottom-nav">
    <a href="dashboard.html" data-page="dashboard.html"><span class="nav-icon icon" data-icon="chart"></span>ホーム</a>
    <a href="assign.html" data-page="assign.html"><span class="nav-icon icon" data-icon="send"></span>配信</a>
    <a href="students.html" data-page="students.html,student.html"><span class="nav-icon icon" data-icon="users"></span>児童</a>
    <a href="kanji-stats.html" data-page="kanji-stats.html"><span class="nav-icon icon" data-icon="grid"></span>漢字別</a>
  </nav>
<script src="../js/app.js"></script>
</body>
</html>
