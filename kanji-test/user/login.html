<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ログイン | 漢字テスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body data-page="login">
<div class="landing">
  <div class="landing-hero">
    <div class="big-kanji"><span>漢</span><span>字</span></div>
    <h1>こんにちは！</h1>
    <p class="lead">おうちの人のメールアドレスで はじめよう。<br>同じメールアドレスなら、どの端末からでも続きができます。</p>
  </div>
  <form class="card" id="login-form" novalidate>
    <div class="field">
      <label for="email">メールアドレス</label>
      <input id="email" class="input" type="email" inputmode="email" autocomplete="email" placeholder="れい：family@example.com" required />
    </div>
    <button class="btn btn-red btn-block btn-lg" type="submit" id="login-btn">はじめる</button>
    <p class="login-msg" id="login-msg" role="alert"></p>
    <p class="small muted" style="margin-top:8px">パスワードや確認メールはありません。メールアドレスは家族の記録をよび出すためだけに使います。</p>
  </form>
  <p class="muted small mt" style="text-align:center"><a href="../index.html">← もどる</a></p>
</div>
<script src="../js/app.js"></script>
</body>
</html>
