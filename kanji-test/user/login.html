<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ログイン | 5年 漢字テスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="landing">
  <div class="landing-hero">
    <div class="big-kanji"><span>漢</span><span>字</span></div>
    <h1>こんにちは！</h1>
    <p class="lead">名前を入れて テストを はじめよう</p>
  </div>
  <form class="card" data-login data-login-to="home.html">
    <div class="field">
      <label for="name">なまえ</label>
      <input id="name" class="input" data-name-input placeholder="れい：さくら" autocomplete="off" />
    </div>
    <div class="field">
      <label for="cls">クラス</label>
      <select id="cls" class="select"><option>5年1組</option><option>5年2組</option><option>5年3組</option></select>
    </div>
    <button class="btn btn-red btn-block btn-lg" type="submit">はじめる</button>
  </form>
  <p class="muted small mt" style="text-align:center"><a href="../index.html">← もどる</a></p>
</div>
<script src="../js/app.js"></script>
</body>
</html>
