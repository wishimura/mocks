<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>漢字表 | 5年 漢字テスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body data-page="kanji">
<div class="app">
  <header class="header">
    <a class="brand" href="home.html"><span class="brand-mark">漢</span><span>5年 漢字テスト<small>光村図書 国語五 銀河・1学期</small></span></a>
    <div class="header-spacer"></div>
    <a class="icon-btn" href="../index.html" aria-label="ログアウト"><span class="icon" data-icon="logout"></span></a>
  </header>
  <nav class="bottom-nav">
    <a href="home.html" data-page="home.html"><span class="nav-icon icon" data-icon="home"></span>ホーム</a>
    <a href="select.html" data-page="select.html"><span class="nav-icon icon" data-icon="pencil"></span>テスト</a>
    <a href="kanji.html" data-page="kanji.html"><span class="nav-icon icon" data-icon="grid"></span>漢字表</a>
    <a href="weak.html" data-page="weak.html"><span class="nav-icon icon" data-icon="target"></span>にがて</a>
    <a href="history.html" data-page="history.html"><span class="nav-icon icon" data-icon="clock"></span>きろく</a>
  </nav>
  <main class="main">
    <h1 class="page-title">1学期の漢字表</h1>
    <p class="page-sub">漢字をタップすると 例文や にている字が 見られるよ</p>
    <div class="search-box">
      <span class="icon" data-icon="search"></span>
      <input class="input" id="search" placeholder="漢字・ことば・読みで さがす" />
    </div>
    <div class="chips" id="filters" data-filter-group>
      <button class="chip active" data-filter="all">ぜんぶ</button>
      <button class="chip" data-filter="weak">にがて</button>
      <button class="chip" data-filter="1">まとまり1</button>
      <button class="chip" data-filter="2">まとまり2</button>
      <button class="chip" data-filter="3">まとまり3</button>
      <button class="chip" data-filter="4">まとまり4</button>
      <button class="chip" data-filter="5">まとまり5</button>
      <button class="chip" data-filter="6">まとまり6</button>
      <button class="chip" data-filter="7">まとまり7</button>
    </div>
    <div class="row small muted" style="gap:16px;flex-wrap:wrap">
      <span><span class="legend-dot dot-good"></span>できた</span>
      <span><span class="legend-dot dot-weak"></span>にがて</span>
      <span><span class="legend-dot dot-none"></span>まだ</span>
    </div>
    <div id="kanji-list"></div>
  </main>
</div>
<script src="../js/app.js"></script>
</body>
</html>
