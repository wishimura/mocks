<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ホーム | 5年 漢字テスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body data-page="home">
<div class="app">
  <header class="header">
    <a class="brand" href="home.html"><span class="brand-mark">漢</span><span>5年 漢字テスト<small>光村図書 国語五 銀河</small></span></a>
    <div class="header-spacer"></div>
    <a class="icon-btn" href="../index.html" aria-label="ログアウト"><span class="icon" data-icon="logout"></span></a>
  </header>
  <nav class="bottom-nav">
    <a href="home.html" data-page="home.html"><span class="nav-icon icon" data-icon="home"></span>ホーム</a>
    <a href="select.html" data-page="select.html"><span class="nav-icon icon" data-icon="pencil"></span>テスト</a>
    <a href="kanji.html" data-page="kanji.html"><span class="nav-icon icon" data-icon="grid"></span>漢字表</a>
    <a href="weak.html" data-page="weak.html"><span class="nav-icon icon" data-icon="target"></span>にがて</a>
    <a href="history.html" data-page="history.html"><span class="nav-icon icon" data-icon="clock"></span>きろく</a>
  </nav>
  <main class="main">
    <div class="hello">
      <span class="avatar" data-user-initial>5</span>
      <div><h1><span data-user-name></span>さん</h1><p id="streak"></p></div>
    </div>

    <div class="term-tabs" data-term-tabs></div>
    <div class="card progress-card">
      <div class="ring" id="ring"></div>
      <div>
        <p class="card-title" style="margin-bottom:6px"><span data-term-name></span>の漢字　<span data-term-count></span>字</p>
        <div class="progress-legend" id="legend"></div>
      </div>
    </div>

    <h2 class="section-title"><span class="icon" data-icon="pencil"></span>すぐに テスト</h2>
    <div class="quick-grid">
      <a class="quick" href="test.html" data-quick="read">
        <span class="q-icon"><span class="icon" data-icon="eye"></span></span><b>読み 100問</b><span class="small">4つから えらぶ</span>
      </a>
      <a class="quick green" href="test.html" data-quick="choose">
        <span class="q-icon"><span class="icon" data-icon="grid"></span></span><b>漢字えらび 100問</b><span class="small">にている字に 気をつけて</span>
      </a>
      <a class="quick yellow" href="test.html" data-quick="write">
        <span class="q-icon"><span class="icon" data-icon="hand"></span></span><b>手書き 100問</b><span class="small">マスか紙に書いて 丸つけ</span>
      </a>
      <a class="quick red" href="weak.html">
        <span class="q-icon"><span class="icon" data-icon="target"></span></span><b>にがて</b><span class="small" id="weak-count"></span>
      </a>
    </div>

    <h2 class="section-title"><span class="icon" data-icon="book"></span>まとまりごとの進みぐあい
      <a class="section-link" href="select.html">えらぶ →</a>
    </h2>
    <div class="stack" id="units"></div>
    <p class="note mt" data-term-note></p>
  </main>
</div>
<script src="../js/app.js"></script>
</body>
</html>
