<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>企業からのいいね | 通知表管理アプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app">
  <header class="header">
    <a href="home.html" class="back-link"><span class="icon icon-lg" data-icon="back"></span></a>
    <div class="brand" style="font-size:16px;">企業からのいいね</div>
  </header>
  <main class="main">
    <div class="notice privacy mb">
      <span class="icon" data-icon="lock"></span>
      <div>企業はあなたを特定できません。気になった企業だけ、こちらから情報を見たり「いいね」を返せます。</div>
    </div>

    <div class="chips mb" data-filter-group>
      <button class="chip active">すべて</button>
      <button class="chip">たろう</button>
      <button class="chip">はなこ</button>
    </div>

    <div class="stack">
      <div class="card">
        <div class="row">
          <span class="role-icon accent"><span class="icon icon-lg" data-icon="building"></span></span>
          <div style="flex:1;">
            <a href="company-view.html" class="fw-bold" style="color:inherit;">北海道ネイチャーラボ（株）</a>
            <p class="muted text-xs">たろうの <span class="tag static sun" style="padding:1px 7px;">生きもの</span> にいいね ・ 2日前</p>
          </div>
        </div>
        <p class="text-sm muted mt-sm">「生きものが好きな子に、北海道の自然体験プログラムを届けたい」</p>
        <div class="row-split mt">
          <a href="company-view.html" class="btn btn-sm btn-secondary">企業を見る</a>
          <button class="like-btn" data-like data-like-text="いいねを返す" data-liked-text="いいね済み"><span class="icon" data-icon="heart"></span><span data-like-label>いいねを返す</span></button>
        </div>
      </div>

      <div class="card">
        <div class="row">
          <span class="role-icon accent"><span class="icon icon-lg" data-icon="building"></span></span>
          <div style="flex:1;">
            <a href="company-view.html" class="fw-bold" style="color:inherit;">サッポロ科学館パートナーズ</a>
            <p class="muted text-xs">たろうの <span class="tag static" style="padding:1px 7px;">理科の実験</span> にいいね ・ 4日前</p>
          </div>
        </div>
        <p class="text-sm muted mt-sm">「実験好きの小学生向けワークショップを開催しています」</p>
        <div class="row-split mt">
          <a href="company-view.html" class="btn btn-sm btn-secondary">企業を見る</a>
          <button class="like-btn liked" data-like data-like-text="いいねを返す" data-liked-text="いいね済み"><span class="icon" data-icon="heart"></span><span data-like-label>いいね済み</span></button>
        </div>
      </div>

      <div class="card">
        <div class="row">
          <span class="role-icon"><span class="icon icon-lg" data-icon="briefcase"></span></span>
          <div style="flex:1;">
            <a href="company-view.html" class="fw-bold" style="color:inherit;">こどもキャリア研究所</a>
            <p class="muted text-xs">たろうの <span class="tag static" style="padding:1px 7px;">やり抜く力</span> にいいね ・ 1週間前</p>
          </div>
        </div>
        <div class="row-split mt">
          <a href="company-view.html" class="btn btn-sm btn-secondary">企業を見る</a>
          <button class="like-btn" data-like data-like-text="いいねを返す" data-liked-text="いいね済み"><span class="icon" data-icon="heart"></span><span data-like-label>いいねを返す</span></button>
        </div>
      </div>
    </div>
  </main>
  <nav class="bottom-nav">
    <a href="home.html" data-page="home.html"><span class="nav-icon icon" data-icon="home"></span>ホーム</a>
    <a href="children.html" data-page="children.html"><span class="nav-icon icon" data-icon="child"></span>子ども</a>
    <a href="add.html" data-page="add.html" class="fab"><span class="nav-icon"><span class="icon" data-icon="plus"></span></span></a>
    <a href="likes.html" data-page="likes.html"><span class="nav-icon icon" data-icon="heart"></span>いいね</a>
    <a href="mypage.html" data-page="mypage.html"><span class="nav-icon icon" data-icon="user"></span>マイページ</a>
  </nav>
</div>
<script src="../js/app.js"></script>
</body>
</html>
