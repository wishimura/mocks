<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>会員ログイン | Lani Ola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-mark">縁</span>
      <h1>Lani Ola</h1>
      <p>MEMBERS LOGIN</p>
    </div>

    <form data-login data-login-to="home.html">
      <div class="form-group">
        <label class="form-label">メールアドレス または 電話番号</label>
        <input type="text" class="form-input" placeholder="example@laniola.net" value="sample@laniola.net" />
      </div>
      <div class="form-group">
        <label class="form-label">パスワード</label>
        <input type="password" class="form-input" placeholder="••••••••" value="••••••••" />
      </div>
      <button type="submit" class="btn btn-block">ログイン</button>
    </form>

    <hr class="divider" />

    <button class="btn btn-line btn-block" data-goto="home.html">
      <span class="icon" data-icon="line"></span>
      LINEでログイン
    </button>

    <p class="muted center" style="font-size: 12px; margin-top: 18px;">
      はじめてのご利用ですか？
      <a href="home.html">新規会員登録</a>
    </p>
    <p class="center" style="margin-top: 6px;">
      <a href="../index.html" style="font-size: 12px; color: var(--text-muted);">← 入口に戻る</a>
    </p>
  </div>
</div>
<script src="../js/app.js"></script>
</body>
</html>
