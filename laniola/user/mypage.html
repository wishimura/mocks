<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>マイページ | Lani Ola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app">
  <header class="header">
    <h1>マイページ</h1>
  </header>

  <main class="main">
    <div class="card" style="display: flex; align-items: center; gap: 14px;">
      <div class="avatar" style="width: 56px; height: 56px; font-size: 20px;">美</div>
      <div style="flex: 1;">
        <p class="serif" style="font-size: 18px; margin: 0;">田中 美咲</p>
        <p class="muted" style="font-size: 13px; margin: 2px 0 0;">会員番号 LO-0001824</p>
      </div>
      <span class="badge badge-gold">GOLD</span>
    </div>

    <h2 class="section-title">連携・通知</h2>
    <div class="stack">
      <div class="integration-row">
        <div class="integration-icon line">
          <span class="icon icon-xl" data-icon="line"></span>
        </div>
        <div style="flex: 1;">
          <p style="margin: 0; font-weight: 600; font-size: 14px;">LINE 連携</p>
          <p class="integration-status"><span class="dot"></span>連携済み ・ 予約通知・お役立ち情報ON</p>
        </div>
        <button class="btn btn-secondary btn-sm" data-demo="LINE連携の設定画面を開きます（モック）">設定</button>
      </div>
    </div>

    <h2 class="section-title">お知らせ設定</h2>
    <div class="card">
      <div class="row-split" style="padding: 6px 0;">
        <span style="font-size: 14px;">予約リマインダー（LINE）</span>
        <span class="badge badge-done">ON</span>
      </div>
      <hr class="divider" />
      <div class="row-split" style="padding: 6px 0;">
        <span style="font-size: 14px;">キャンペーン情報（LINE）</span>
        <span class="badge badge-done">ON</span>
      </div>
      <hr class="divider" />
      <div class="row-split" style="padding: 6px 0;">
        <span style="font-size: 14px;">ポイント残高メール</span>
        <span class="badge badge-silver">OFF</span>
      </div>
    </div>

    <h2 class="section-title">アカウント</h2>
    <div class="stack">
      <a href="#" class="event-item" style="display: flex; align-items: center; gap: 12px;">
        <span class="icon icon-lg" style="color: var(--primary);" data-icon="edit"></span>
        <span style="flex: 1; font-size: 14px;">プロフィールを編集</span>
        <span class="icon" data-icon="chevron" style="color: var(--text-muted);"></span>
      </a>
      <a href="#" class="event-item" style="display: flex; align-items: center; gap: 12px;">
        <span class="icon icon-lg" style="color: var(--primary);" data-icon="help"></span>
        <span style="flex: 1; font-size: 14px;">よくある質問</span>
        <span class="icon" data-icon="chevron" style="color: var(--text-muted);"></span>
      </a>
      <a href="#" class="event-item" style="display: flex; align-items: center; gap: 12px;">
        <span class="icon icon-lg" style="color: var(--primary);" data-icon="mail"></span>
        <span style="flex: 1; font-size: 14px;">お問い合わせ</span>
        <span class="icon" data-icon="chevron" style="color: var(--text-muted);"></span>
      </a>
      <a href="../index.html" class="event-item" style="display: flex; align-items: center; gap: 12px; color: var(--danger);">
        <span class="icon icon-lg" data-icon="logout"></span>
        <span style="flex: 1; font-size: 14px;">ログアウト</span>
      </a>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="home.html" data-page="home.html"><span class="nav-icon icon" data-icon="home"></span>ホーム</a>
    <a href="booking.html" data-page="booking.html"><span class="nav-icon icon" data-icon="calendar"></span>予約</a>
    <a href="membership.html" data-page="membership.html"><span class="nav-icon icon" data-icon="qr"></span>会員証</a>
    <a href="history.html" data-page="history.html"><span class="nav-icon icon" data-icon="history"></span>来店履歴</a>
    <a href="mypage.html" data-page="mypage.html"><span class="nav-icon icon" data-icon="user"></span>マイページ</a>
  </nav>
</div>
<script src="../js/app.js"></script>
</body>
</html>
