<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>スタッフログイン | Lani Ola</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-mark">縁</span>
      <h1>Lani Ola</h1>
      <p>STAFF LOGIN</p>
    </div>

    <form data-login data-login-to="dashboard.html">
      <div class="form-group">
        <label class="form-label">スタッフID</label>
        <input type="text" class="form-input" placeholder="staff@laniola.net" value="manager@laniola.net" />
      </div>
      <div class="form-group">
        <label class="form-label">パスワード</label>
        <input type="password" class="form-input" placeholder="••••••••" value="••••••••" />
      </div>
      <div class="form-group">
        <label class="form-label">店舗</label>
        <select class="form-select">
          <option>目黒・白金台店</option>
          <option>横浜 妙蓮寺店</option>
          <option>湘南・鵠沼海岸店</option>
          <option>本部</option>
        </select>
      </div>
      <button type="submit" class="btn btn-block">ログイン</button>
    </form>

    <p class="center" style="margin-top: 16px;">
      <a href="../index.html" style="font-size: 12px; color: var(--text-muted);">← 入口に戻る</a>
    </p>
  </div>
</div>
<script src="../js/app.js"></script>
</body>
</html>
