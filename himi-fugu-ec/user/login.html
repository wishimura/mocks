<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ログイン | 氷見とらふぐ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-mark">氷</span>
      <h1>氷見とらふぐ</h1>
      <p>MEMBERS LOGIN</p>
    </div>

    <form data-login data-login-to="home.html">
      <div class="field">
        <label class="field-label">メールアドレス</label>
        <input class="input" type="email" placeholder="example@himi-fugu.jp" value="member@example.com" />
      </div>
      <div class="field">
        <label class="field-label">パスワード</label>
        <input class="input" type="password" value="********" />
      </div>
      <button type="submit" class="btn btn-block">ログイン</button>
    </form>

    <p class="muted center" style="font-size: 12px; margin: 16px 0 0;">
      <a href="#" data-demo="モックのため新規会員登録は省略しています">新規会員登録</a>
      　/
      <a href="#" data-demo="モックのためパスワード再発行は省略しています">パスワードを忘れた方</a>
    </p>

    <p class="center" style="margin-top: 22px;">
      <a href="../index.html" style="font-size: 12px; color: var(--text-muted);">← ロール選択に戻る</a>
    </p>
  </div>
</div>
<script src="../js/app.js"></script>
</body>
</html>
