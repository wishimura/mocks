<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>管理画面ログイン | 氷見とらふぐ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="login-wrap" style="background: linear-gradient(135deg, #062537 0%, #0a3a5a 100%);">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-mark" style="background: var(--accent); color: #3d2c10;">管</span>
      <h1>Citrus Admin</h1>
      <p>氷見とらふぐ EC 管理画面</p>
    </div>

    <form data-login data-login-to="dashboard.html">
      <div class="field">
        <label class="field-label">スタッフID</label>
        <input class="input" placeholder="staff@example.com" value="staff@example.com" />
      </div>
      <div class="field">
        <label class="field-label">パスワード</label>
        <input class="input" type="password" value="********" />
      </div>
      <button type="submit" class="btn btn-block">ログイン</button>
    </form>

    <p class="muted center" style="font-size: 11px; margin: 18px 0 0;">
      ※ 社内ネットワーク以外からのアクセスは2要素認証が必要です
    </p>
    <p class="center" style="margin-top: 14px;">
      <a href="../index.html" style="font-size: 12px; color: var(--text-muted);">← ロール選択に戻る</a>
    </p>
  </div>
</div>
<script src="../js/app.js"></script>
</body>
</html>
