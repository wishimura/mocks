<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>4択クイズ | Citrus Learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app">
  <header class="header">
    <a href="deck.html" class="back"><span class="icon icon-lg" data-icon="x"></span></a>
    <h1>英単語ターゲット1900</h1>
  </header>

  <main class="main">
    <div class="quiz-progress-label"><span>問題 2 / 3</span><span>4択クイズ</span></div>
    <div class="quiz-progress-wrap"><div class="quiz-progress" style="width:66%;"></div></div>

    <div class="quiz-card" style="margin-top:16px;">
      <div class="quiz-deck-tag">ENGLISH WORD</div>
      <div class="quiz-word">generous</div>
      <div class="quiz-word-sub">/ ˈdʒɛnərəs /</div>
      <div class="quiz-instruction">意味として正しいものを選んでください</div>
    </div>

    <div class="choice-list" data-choice-quiz>
      <button class="choice-btn" data-choice="wrong"><span class="choice-letter">A</span>臆病な</button>
      <button class="choice-btn" data-choice="wrong"><span class="choice-letter">B</span>正確な</button>
      <button class="choice-btn" data-choice="correct"><span class="choice-letter">C</span>寛大な、気前の良い</button>
      <button class="choice-btn" data-choice="wrong"><span class="choice-letter">D</span>疲れ果てた</button>

      <div class="feedback-banner hidden" data-quiz-feedback>
        <span class="icon" data-icon="check"></span>
        <span data-feedback-text></span>
        <span class="feedback-answer">反意語: stingy（けちな）</span>
      </div>
      <a href="quiz-choice-eng-3.html" class="btn btn-block hidden" data-quiz-next style="margin-top:8px;">次の問題へ</a>
    </div>
  </main>
</div>
<script src="../js/app.js"></script>
</body>
</html>
