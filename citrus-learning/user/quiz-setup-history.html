<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>出題形式を選ぶ | Citrus Learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app">
  <header class="header">
    <a href="deck.html" class="back"><span class="icon icon-lg" data-icon="back"></span></a>
    <h1>世界史 一問一答</h1>
  </header>

  <main class="main">
    <div class="card">
      <p class="card-title">出題範囲</p>
      <div class="chip-row" data-select-group style="margin-bottom:0;">
        <button class="filter-chip active" data-select>近代ヨーロッパ史</button>
        <button class="filter-chip" data-select>古代・中世史</button>
        <button class="filter-chip" data-select>全範囲</button>
      </div>
    </div>

    <div class="section-title">出題形式を選ぶ</div>
    <div class="format-grid">
      <a href="quiz-choice-history-1.html" class="format-card">
        <span class="icon" data-icon="grid"></span>
        <h3>4択クイズ</h3>
        <p>年代・人物・出来事を<br>一問一答形式で出題</p>
      </a>
    </div>

    <div class="card" style="margin-top:16px;">
      <p class="card-title">今回の出題</p>
      <div class="row-split">
        <span>問題数</span>
        <strong>3問</strong>
      </div>
      <div class="row-split" style="margin-top:8px;">
        <span>推定時間</span>
        <strong>約1分</strong>
      </div>
    </div>
  </main>
</div>
<script src="../js/app.js"></script>
</body>
</html>
