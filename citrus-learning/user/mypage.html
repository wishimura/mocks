<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>マイページ | Citrus Learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app">
  <header class="header">
    <h1>マイページ</h1>
  </header>

  <main class="main">
    <div class="card" style="display:flex; align-items:center; gap:14px;">
      <span class="rank-avatar" style="width:56px; height:56px; font-size:18px;">佐</span>
      <div style="flex:1;">
        <p style="margin:0; font-weight:700; font-size:16px;">佐藤 潤</p>
        <p class="muted" style="margin:2px 0 0; font-size:12.5px;">高校3年生・累計1,590問クリア</p>
      </div>
      <a href="#" class="btn btn-secondary btn-sm">編集</a>
    </div>

    <div class="section-title">学習設定</div>
    <div class="card">
      <div class="setting-row">
        <div><p class="setting-title">1日の目標問題数</p><p class="setting-sub">現在: 20問/日</p></div>
        <a href="#" class="muted"><span class="icon" data-icon="chevron"></span></a>
      </div>
      <div class="setting-row">
        <div><p class="setting-title">リマインド通知</p><p class="setting-sub">毎日 20:00 に学習を促す通知</p></div>
        <label class="toggle"><input type="checkbox" checked /><span class="toggle-track"></span></label>
      </div>
      <div class="setting-row">
        <div><p class="setting-title">正解時の効果音</p><p class="setting-sub">クイズ回答時のサウンド</p></div>
        <label class="toggle"><input type="checkbox" checked /><span class="toggle-track"></span></label>
      </div>
      <div class="setting-row">
        <div><p class="setting-title">ランキングへの表示</p><p class="setting-sub">全国ランキングに参加する</p></div>
        <label class="toggle"><input type="checkbox" checked /><span class="toggle-track"></span></label>
      </div>
    </div>

    <div class="section-title">アカウント</div>
    <div class="card">
      <div class="setting-row">
        <div><p class="setting-title">プラン</p><p class="setting-sub">無料プラン（デッキ3件まで）</p></div>
        <button class="btn btn-accent btn-sm" data-demo="プラン変更ページへ（モック動作）">アップグレード</button>
      </div>
      <div class="setting-row">
        <div><p class="setting-title">お問い合わせ</p></div>
        <a href="#" class="muted"><span class="icon" data-icon="chevron"></span></a>
      </div>
    </div>

    <button class="btn btn-secondary btn-block" style="margin-top:16px;" data-goto="../index.html">
      <span class="icon" data-icon="logout"></span>ログアウト
    </button>
  </main>

  <nav class="bottom-nav">
    <a href="home.html" data-page="home.html"><span class="nav-icon icon" data-icon="home"></span>ホーム</a>
    <a href="deck.html" data-page="deck.html"><span class="nav-icon icon" data-icon="layers"></span>デッキ</a>
    <a href="ranking.html" data-page="ranking.html"><span class="nav-icon icon" data-icon="trophy"></span>ランキング</a>
    <a href="history.html" data-page="history.html"><span class="nav-icon icon" data-icon="clock"></span>履歴</a>
    <a href="mypage.html" data-page="mypage.html"><span class="nav-icon icon" data-icon="user"></span>マイページ</a>
  </nav>
</div>
<script src="../js/app.js"></script>
</body>
</html>
