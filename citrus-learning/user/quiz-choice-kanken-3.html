<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>4択クイズ | Citrus Learning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app">
  <header class="header">
    <a href="deck.html" class="back"><span class="icon icon-lg" data-icon="x"></span></a>
    <h1>漢字検定2級 対策</h1>
  </header>

  <main class="main">
    <div class="quiz-progress-label"><span>問題 3 / 3</span><span>部首</span></div>
    <div class="quiz-progress-wrap"><div class="quiz-progress" style="width:100%;"></div></div>

    <div class="quiz-card" style="margin-top:16px;">
      <div class="quiz-deck-tag">部首を答えなさい</div>
      <div class="quiz-word" style="font-size:44px;">際</div>
      <div class="quiz-instruction">この漢字の部首を選んでください</div>
    </div>

    <div class="choice-list" data-choice-quiz>
      <button class="choice-btn" data-choice="correct"><span class="choice-letter">A</span>こざとへん（阝）</button>
      <button class="choice-btn" data-choice="wrong"><span class="choice-letter">B</span>りっしんべん（忄）</button>
      <button class="choice-btn" data-choice="wrong"><span class="choice-letter">C</span>さんずい（氵）</button>
      <button class="choice-btn" data-choice="wrong"><span class="choice-letter">D</span>くにがまえ（囗）</button>

      <div class="feedback-banner hidden" data-quiz-feedback>
        <span class="icon" data-icon="check"></span>
        <span data-feedback-text></span>
        <span class="feedback-answer">こざとへんは丘や段差に関連する漢字に使われます</span>
      </div>
      <a href="result-kanken.html" class="btn btn-block hidden" data-quiz-next style="margin-top:8px;">結果を見る</a>
    </div>
  </main>
</div>
<script src="../js/app.js"></script>
</body>
</html>
