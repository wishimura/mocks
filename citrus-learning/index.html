<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Citrus Learning（AnkiLab）モック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-icon" data-icon="layers"></span>
      <h1>Citrus Learning</h1>
      <p>4択・スペル入力・フラッシュカードで鍛える暗記学習アプリ</p>
    </div>

    <a href="user/login.html" class="role-btn">
      <span class="role-icon"><span class="icon" data-icon="user"></span></span>
      <div>
        <p class="role-title">学習者として使う</p>
        <p class="role-sub">英単語・漢字・漢検などをクイズで学習</p>
      </div>
      <span class="role-chevron"><span class="icon" data-icon="chevron"></span></span>
    </a>

    <a href="admin/login.html" class="role-btn">
      <span class="role-icon"><span class="icon" data-icon="shield"></span></span>
      <div>
        <p class="role-title">管理者として使う</p>
        <p class="role-sub">問題・デッキ作成、学習状況の管理</p>
      </div>
      <span class="role-chevron"><span class="icon" data-icon="chevron"></span></span>
    </a>

    <p class="muted" style="text-align: center; font-size: 12px; margin-top: 20px;">
      ※ これはHTMLデザインモックです。サーバー処理はありません。
    </p>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
