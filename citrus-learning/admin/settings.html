<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>設定 | Citrus Learning管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app">
  <header class="header">
    <h1>設定</h1>
  </header>

  <main class="main">
    <div class="section-title">アプリ全体設定</div>
    <div class="card">
      <div class="setting-row">
        <div><p class="setting-title">ランキング機能</p><p class="setting-sub">学習者向けに週間ランキングを表示する</p></div>
        <label class="toggle"><input type="checkbox" checked /><span class="toggle-track"></span></label>
      </div>
      <div class="setting-row">
        <div><p class="setting-title">連続学習ストリーク表示</p><p class="setting-sub">ホーム画面に連続日数を表示する</p></div>
        <label class="toggle"><input type="checkbox" checked /><span class="toggle-track"></span></label>
      </div>
      <div class="setting-row">
        <div><p class="setting-title">スペル入力モード</p><p class="setting-sub">デッキ単位でスペル入力を許可する</p></div>
        <label class="toggle"><input type="checkbox" checked /><span class="toggle-track"></span></label>
      </div>
      <div class="setting-row">
        <div><p class="setting-title">新規登録の受付</p><p class="setting-sub">新しい学習者のアカウント作成を許可</p></div>
        <label class="toggle"><input type="checkbox" checked /><span class="toggle-track"></span></label>
      </div>
    </div>

    <div class="section-title">リマインド通知</div>
    <div class="card">
      <div class="form-group">
        <label class="form-label">通知テンプレート</label>
        <textarea class="form-textarea">今日もコツコツ暗記しよう！{{name}}さんの連続記録は{{streak}}日目です。</textarea>
      </div>
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label">送信時刻</label>
        <input class="form-input" type="time" value="20:00" style="max-width:160px;" />
      </div>
    </div>

    <div class="section-title">管理者アカウント</div>
    <div class="item-list">
      <div class="card row-split">
        <div><p style="margin:0; font-weight:700;">佐藤 潤</p><p class="muted" style="font-size:12.5px; margin:2px 0 0;">オーナー・全権限</p></div>
        <span class="badge badge-active">有効</span>
      </div>
      <div class="card row-split">
        <button class="btn btn-secondary btn-block" data-demo="管理者を招待するリンクを発行しました（モック動作）">
          <span class="icon" data-icon="plus"></span>管理者を招待
        </button>
      </div>
    </div>

    <button class="btn btn-secondary btn-block" style="margin-top:16px;" data-goto="../index.html">
      <span class="icon" data-icon="logout"></span>ログアウト
    </button>
  </main>

  <nav class="bottom-nav">
    <a href="dashboard.html" data-page="dashboard.html"><span class="nav-icon icon" data-icon="bar"></span>ダッシュボード</a>
    <a href="decks.html" data-page="decks.html"><span class="nav-icon icon" data-icon="layers"></span>デッキ</a>
    <a href="questions.html" data-page="questions.html"><span class="nav-icon icon" data-icon="edit"></span>問題</a>
    <a href="users.html" data-page="users.html"><span class="nav-icon icon" data-icon="users"></span>会員</a>
    <a href="settings.html" data-page="settings.html"><span class="nav-icon icon" data-icon="settings"></span>設定</a>
  </nav>
</div>
<script src="../js/app.js"></script>
</body>
</html>
