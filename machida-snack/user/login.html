<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ログイン | マチスナ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-mark">杯</span>
      <h1>マチスナ</h1>
      <p>MACHIDA SNACK GUIDE</p>
    </div>
    <p class="tagline">町田のスナック、扉の中まで見える。</p>

    <form data-login data-login-to="home.html">
      <div class="form-group">
        <label class="form-label">メールアドレス</label>
        <input type="email" class="form-input" value="you@example.com" />
      </div>
      <div class="form-group">
        <label class="form-label">パスワード</label>
        <input type="password" class="form-input" value="demopass" />
      </div>
      <button type="submit" class="btn btn-block">ログイン</button>
    </form>

    <div class="divider"></div>

    <a href="home.html" class="btn btn-secondary btn-block" style="margin-bottom: 10px;">
      <span class="icon" data-icon="user"></span>
      ゲストで試す
    </a>
    <a href="#" class="btn btn-dark btn-block" data-demo="LINEログイン（モック）">
      <span class="icon" data-icon="chat"></span>
      LINEでログイン
    </a>

    <p class="muted center" style="font-size: 11px; margin-top: 22px;">
      会員登録がなくても一覧・詳細は閲覧できます
    </p>
  </div>
</div>
<script src="../js/app.js"></script>
</body>
</html>
