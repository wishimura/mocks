<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>管理ログイン | マチスナ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-mark" style="background: linear-gradient(135deg, var(--deep), var(--accent));">管</span>
      <h1>マチスナ 管理</h1>
      <p>ADMIN CONSOLE</p>
    </div>
    <p class="tagline">運営・店舗オーナー様用</p>

    <form data-login data-login-to="dashboard.html">
      <div class="form-group">
        <label class="form-label">管理者ID</label>
        <input type="text" class="form-input" value="admin@machi-sna.jp" />
      </div>
      <div class="form-group">
        <label class="form-label">パスワード</label>
        <input type="password" class="form-input" value="demopass" />
      </div>
      <button type="submit" class="btn btn-dark btn-block">
        <span class="icon" data-icon="lock"></span>管理画面にログイン
      </button>
    </form>

    <p class="muted center" style="font-size: 11px; margin-top: 22px;">
      IDをお忘れの方は運営までお問い合わせください
    </p>
  </div>
</div>
<script src="../js/app.js"></script>
</body>
</html>
