<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>マチスナ | 町田スナック図鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-mark">杯</span>
      <h1>マチスナ</h1>
      <p>MACHIDA SNACK GUIDE</p>
    </div>
    <p class="tagline">町田のスナック、扉の中まで見える。</p>

    <a href="user/login.html" class="role-btn">
      <span class="role-icon"><span class="icon" data-icon="drink"></span></span>
      <div>
        <p class="role-title">呑みに行きたい人はこちら</p>
        <p class="role-sub">お店を探す / 口コミ / 今ここ掲示板</p>
      </div>
      <span class="role-chevron"><span class="icon" data-icon="chevron"></span></span>
    </a>

    <a href="admin/login.html" class="role-btn">
      <span class="role-icon admin"><span class="icon" data-icon="shield"></span></span>
      <div>
        <p class="role-title">運営・店舗オーナー様用</p>
        <p class="role-sub">店舗情報管理 / 口コミモデレーション</p>
      </div>
      <span class="role-chevron"><span class="icon" data-icon="chevron"></span></span>
    </a>

    <p class="muted center" style="font-size: 11px; margin-top: 22px;">
      ※ これは提案用のHTMLデザインモックです
    </p>
  </div>
