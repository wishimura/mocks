<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>マイページ | イベント管理</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app">
  <header class="header">
    <h1>マイページ</h1>
  </header>

  <main class="main">
    <div class="card" style="text-align: center;">
      <div style="width: 72px; height: 72px; background: var(--primary-light); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 32px; margin-bottom: 8px;">👤</div>
      <h2 style="margin: 0; font-size: 18px;">山田 運営</h2>
      <p class="muted" style="margin: 4px 0 0; font-size: 14px;">admin@example.com</p>
      <p class="muted" style="margin: 4px 0 0; font-size: 12px;">権限: 管理者</p>
    </div>

    <h2 class="section-title">申込履歴</h2>
    <div class="item-list">
      <div class="applicant-row">
        <div class="applicant-info">
          <div class="applicant-name">春の交流会 2026</div>
          <div class="applicant-sub">2026/04/28・¥3,000</div>
        </div>
        <span class="badge badge-done">受付済</span>
      </div>
      <div class="applicant-row">
        <div class="applicant-info">
          <div class="applicant-name">ビジネスセミナー 第5回</div>
          <div class="applicant-sub">2026/05/10・¥5,000</div>
        </div>
        <span class="badge badge-pending">未受付</span>
      </div>
    </div>

    <h2 class="section-title">設定</h2>
    <div class="item-list">
      <a href="#" class="applicant-row"><div class="applicant-info"><div class="applicant-name">プロフィール編集</div></div><span>›</span></a>
      <a href="#" class="applicant-row"><div class="applicant-info"><div class="applicant-name">パスワード変更</div></div><span>›</span></a>
      <a href="#" class="applicant-row"><div class="applicant-info"><div class="applicant-name">通知設定</div></div><span>›</span></a>
      <a href="#" class="applicant-row"><div class="applicant-info"><div class="applicant-name">ヘルプ</div></div><span>›</span></a>
    </div>

    <div style="margin-top: 16px;">
      <a href="login.html" class="btn btn-secondary btn-block">ログアウト</a>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="dashboard.html" data-page="dashboard.html"><span class="nav-icon">🏠</span>ホーム</a>
    <a href="events.html" data-page="events.html"><span class="nav-icon">📅</span>イベント</a>
    <a href="reception.html" data-page="reception.html"><span class="nav-icon">🎫</span>受付</a>
    <a href="invoices.html" data-page="invoices.html"><span class="nav-icon">💴</span>請求</a>
    <a href="mypage.html" data-page="mypage.html"><span class="nav-icon">👤</span>マイページ</a>
  </nav>
</div>
<script src="js/app.js"></script>
</body>
</html>
