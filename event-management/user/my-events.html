<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>申込履歴 | イベント</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app">
  <header class="header">
    <h1>申込履歴</h1>
  </header>

  <main class="main">
    <div class="filters" data-filter-group>
      <button class="filter-chip active">すべて</button>
      <button class="filter-chip">これから</button>
      <button class="filter-chip">終了</button>
    </div>

    <h2 class="section-title">これからのイベント</h2>
    <div class="event-list">
      <a class="event-item" href="ticket.html">
        <div class="row-split">
          <p class="event-title">春の交流会 2026</p>
          <span class="badge badge-pending">未受付</span>
        </div>
        <div class="event-meta">
          <span><span class="icon" data-icon="calendar"></span>2026/04/28 (火) 14:00</span>
          <span><span class="icon" data-icon="location"></span>市民会館 3F</span>
        </div>
        <div class="row-split" style="margin-top: 8px; font-size: 13px;">
          <span class="muted">¥3,000・当日会場</span>
          <span style="color: var(--primary); font-weight: 600;">チケットを見る</span>
        </div>
      </a>

      <a class="event-item" href="ticket.html">
        <div class="row-split">
          <p class="event-title">ビジネスセミナー 第5回</p>
          <span class="badge badge-pending">未受付</span>
        </div>
        <div class="event-meta">
          <span><span class="icon" data-icon="calendar"></span>2026/05/10 (日) 10:00</span>
          <span><span class="icon" data-icon="location"></span>オンライン</span>
        </div>
        <div class="row-split" style="margin-top: 8px; font-size: 13px;">
          <span class="muted">¥5,000・支払済</span>
          <span style="color: var(--primary); font-weight: 600;">チケットを見る</span>
        </div>
      </a>
    </div>

    <h2 class="section-title">過去のイベント</h2>
    <div class="event-list">
      <a class="event-item" href="#">
        <div class="row-split">
          <p class="event-title">新年会 2026</p>
          <span class="badge badge-done">受付済</span>
        </div>
        <div class="event-meta">
          <span><span class="icon" data-icon="calendar"></span>2026/01/15</span>
          <span><span class="icon" data-icon="yen"></span>4,000</span>
        </div>
      </a>
      <a class="event-item" href="#">
        <div class="row-split">
          <p class="event-title">特別講演会 2025冬</p>
          <span class="badge badge-done">受付済</span>
        </div>
        <div class="event-meta">
          <span><span class="icon" data-icon="calendar"></span>2025/12/10</span>
          <span><span class="icon" data-icon="yen"></span>1,000</span>
        </div>
      </a>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="events.html" data-page="events.html"><span class="nav-icon" data-icon="home"></span>ホーム</a>
    <a href="my-events.html" data-page="my-events.html"><span class="nav-icon" data-icon="calendar"></span>申込履歴</a>
    <a href="ticket.html" data-page="ticket.html"><span class="nav-icon" data-icon="ticket"></span>チケット</a>
    <a href="receipts.html" data-page="receipts.html"><span class="nav-icon" data-icon="receipt"></span>支払い</a>
    <a href="mypage.html" data-page="mypage.html"><span class="nav-icon" data-icon="user"></span>マイページ</a>
  </nav>
</div>
<script src="../js/app.js"></script>
</body>
</html>
