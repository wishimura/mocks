  <main class="main">
    <div class="card">
      <h2 style="margin: 0 0 12px; font-size: 22px;">春の交流会 2026</h2>

      <div style="display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; font-size: 14px;">

        プロの司会者による進行で、自己紹介・フリートーク・名刺交換の時間を設けます。
      </p>

      <h3 style="font-size: 14px; margin: 16px 0 6px;">主催</h3>
      <p style="margin: 0; font-size: 14px;"><span class="icon" data-icon="building"></span> イベント管理株式会社</p>
    </div>

    <div style="margin-top: 16px;">
      <a href="apply.html?id=1" class="btn btn-block">申込む（3,000円）</a>
      <p class="muted" style="text-align: center; font-size: 12px; margin-top: 8px;">
        お支払いは当日会場にて
      </p>
    </div>

  <nav class="bottom-nav">
