<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>領収書 | イベント</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app">
  <header class="header">
    <button class="back" onclick="history.back()"><span class="icon" data-icon="back"></span></button>
    <h1>領収書</h1>
    <button class="header-action" data-pdf><span class="icon" data-icon="download"></span>PDF</button>
  </header>

  <main class="main">
    <div class="pdf-preview">
      <h2>領収書</h2>
      <p style="text-align: center; color: var(--text-muted); margin: 0 0 8px;">Receipt</p>

      <div class="invoice-meta">
        <div>
          <p style="margin: 0;"><strong>領収書番号:</strong> R-2026-0510-042</p>
          <p style="margin: 0;"><strong>発行日:</strong> 2026/05/10</p>
        </div>
        <div style="text-align: right;">
          <p style="margin: 0;"><strong>イベント管理株式会社</strong></p>
          <p style="margin: 0; font-size: 12px;">東京都千代田区〇〇 1-2-3</p>
        </div>
      </div>

      <div style="text-align: center; margin: 24px 0;">
        <p style="margin: 0; font-size: 14px; color: var(--text-muted);">山田 太郎 様</p>
        <p style="font-size: 28px; font-weight: 700; margin: 8px 0;">¥5,000</p>
        <p style="margin: 0; font-size: 13px; color: var(--text-muted);">但し、ビジネスセミナー 第5回 参加費として</p>
      </div>

      <div style="margin-top: 16px; display: grid; grid-template-columns: 1fr auto; gap: 8px; font-size: 14px; border-top: 1px solid var(--border); padding-top: 12px;">
        <div class="muted">小計</div><div style="text-align: right;">¥4,546</div>
        <div class="muted">消費税 (10%)</div><div style="text-align: right;">¥454</div>
      </div>

      <div class="pdf-total">
        <span>合計金額</span>
        <span>¥5,000</span>
      </div>
    </div>

    <div style="margin-top: 16px;">
      <button class="btn btn-block" data-pdf><span class="icon" data-icon="download"></span>PDFダウンロード</button>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="events.html" data-page="events.html"><span class="nav-icon" data-icon="home"></span>ホーム</a>
    <a href="my-events.html" data-page="my-events.html"><span class="nav-icon" data-icon="calendar"></span>申込履歴</a>
    <a href="ticket.html" data-page="ticket.html"><span class="nav-icon" data-icon="ticket"></span>チケット</a>
    <a href="receipts.html" data-page="receipts.html" class="active"><span class="nav-icon" data-icon="receipt"></span>支払い</a>
    <a href="mypage.html" data-page="mypage.html"><span class="nav-icon" data-icon="user"></span>マイページ</a>
  </nav>
</div>
<script src="../js/app.js"></script>
</body>
</html>
