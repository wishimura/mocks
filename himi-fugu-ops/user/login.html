<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>作業者ログイン | Citrusアプリ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <span class="logo-mark">C</span>
      <h1>Citrusアプリ</h1>
      <p>WORKER LOGIN</p>
    </div>

    <form data-login data-login-to="home.html">
      <div class="field">
        <label class="field-label">作業者ID</label>
        <input class="input" placeholder="c-001" value="c-002" />
      </div>
      <div class="field">
        <label class="field-label">パスワード</label>
        <input class="input" type="password" value="********" />
      </div>
      <button type="submit" class="btn btn-block btn-accent">ログイン</button>
    </form>

    <p class="muted center" style="font-size: 11px; margin: 18px 0 0;">
      共有端末でログインしている場合は終業時にログアウトしてください
    </p>
    <p class="center" style="margin-top: 14px;">
      <a href="../index.html" style="font-size: 12px; color: var(--text-muted);">← ロール選択に戻る</a>
    </p>
  </div>
</div>
<script src="../js/app.js"></script>
</body>
</html>
