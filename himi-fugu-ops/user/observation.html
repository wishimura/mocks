<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>観察・死亡記録 | HSA Aqua Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app">
  <header class="header">
    <button class="back" onclick="history.back()" aria-label="戻る"><span class="icon icon-lg" data-icon="back"></span></button>
    <h1>観察・死亡記録</h1>
  </header>

  <main class="main">
    <div class="card">
      <p class="muted" style="font-size: 11px; letter-spacing: 0.16em; margin: 0 0 8px;">2026.04.27（月）07:00 現在</p>

      <form data-login data-login-to="home.html">
        <div class="field">
          <label class="field-label">対象水槽</label>
          <div class="chips" data-filter-group>
            <span class="filter-chip">T-01</span>
            <span class="filter-chip">T-02</span>
            <span class="filter-chip active">T-03</span>
            <span class="filter-chip">T-04</span>
            <span class="filter-chip">T-05</span>
          </div>
        </div>

        <div class="field">
          <label class="field-label">全体の様子</label>
          <div class="chips" data-filter-group>
            <span class="filter-chip">不調</span>
            <span class="filter-chip">気になる</span>
            <span class="filter-chip active">良好</span>
            <span class="filter-chip">非常に活発</span>
          </div>
        </div>

        <div class="field">
          <label class="field-label">気になる個体</label>
          <div class="stack">
            <a href="#" class="card" data-select style="display: flex; align-items: center; gap: 10px; padding: 12px 14px;">
              <span class="icon icon-lg" style="color: var(--text-muted);" data-icon="check"></span>
              <span style="flex:1; font-size: 13px;">いない</span>
            </a>
            <a href="#" class="card selected" data-select style="display: flex; align-items: center; gap: 10px; padding: 12px 14px;">
              <span class="icon icon-lg" style="color: var(--warn);" data-icon="alert"></span>
              <span style="flex:1; font-size: 13px;">動きが鈍い個体あり</span>
            </a>
            <a href="#" class="card" data-select style="display: flex; align-items: center; gap: 10px; padding: 12px 14px;">
              <span class="icon icon-lg" style="color: var(--danger);" data-icon="alert"></span>
              <span style="flex:1; font-size: 13px;">体表に異変あり</span>
            </a>
          </div>
        </div>

        <div class="field">
          <label class="field-label">死亡尾数</label>
          <div class="row-split" style="gap: 14px;">
            <div class="stepper" data-stepper data-step="1" data-min="0" data-unit=" 尾">
              <button type="button" data-dir="down">−</button>
              <span class="num">0 尾</span>
              <button type="button" data-dir="up">＋</button>
            </div>
            <span class="muted" style="font-size: 12px;">該当があれば写真も</span>
          </div>
        </div>

        <div class="field">
          <label class="field-label">死亡推定原因（該当あれば）</label>
          <select class="select">
            <option>選択してください</option>
            <option>—</option>
            <option>外傷</option>
            <option>病気疑い</option>
            <option>水質悪化</option>
            <option>その他</option>
          </select>
        </div>

        <div class="field">
          <label class="field-label">メモ</label>
          <textarea class="textarea" placeholder="例）水温19℃台で食いつきはやや落ちている。明日も注視。">水温19℃台で食いつきはやや落ちている。明日も注視。</textarea>
        </div>

        <div class="field">
          <label class="field-label">写真（任意・最大3枚）</label>
          <button type="button" class="btn btn-secondary btn-block" data-demo="カメラを起動（モック）">
            <span class="icon" data-icon="camera"></span>写真を撮る
          </button>
        </div>

        <button type="submit" class="btn btn-block btn-accent" style="margin-top: 8px;">
          <span class="icon" data-icon="check"></span>記録する
        </button>
      </form>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="home.html" data-page="home.html"><span class="nav-icon icon" data-icon="home"></span>ホーム</a>
    <a href="feeding.html" data-page="feeding.html"><span class="nav-icon icon" data-icon="feed"></span>給餌</a>
    <a href="observation.html" data-page="observation.html"><span class="nav-icon icon" data-icon="clipboard"></span>観察</a>
    <a href="measurement.html" data-page="measurement.html"><span class="nav-icon icon" data-icon="scale"></span>測定</a>
    <a href="history.html" data-page="history.html"><span class="nav-icon icon" data-icon="history"></span>履歴</a>
  </nav>
</div>
<script src="../js/app.js"></script>
</body>
</html>
