<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Citrusアプリ | モック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
<style>
  .role-card { background: #fff; border-radius: 16px; padding: 36px 28px; width: 100%; max-width: 440px; box-shadow: var(--shadow-lg); }
  .role-btn { display: flex; align-items: center; gap: 16px; padding: 18px 20px; border-radius: 12px; border: 1px solid var(--border-strong); background: #fff; color: var(--text); width: 100%; text-align: left; transition: border-color 0.15s, background 0.15s; text-decoration: none; }
  .role-btn:hover { border-color: var(--accent); background: var(--accent-light); text-decoration: none; }
  .role-btn + .role-btn { margin-top: 12px; }
  .role-icon { width: 44px; height: 44px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; background: var(--primary-light); color: var(--primary); flex-shrink: 0; }
  .role-icon .icon { width: 22px; height: 22px; }
  .role-title { margin: 0; font-size: 15px; font-weight: 600; }
  .role-sub { margin: 2px 0 0; font-size: 12px; color: var(--text-muted); }
  .role-chevron { margin-left: auto; color: var(--text-muted); }
  .tagline { text-align: center; font-size: 11px; letter-spacing: 0.24em; color: var(--text-muted); margin: 0 0 22px; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="role-card">
    <div class="login-logo">
      <span class="logo-mark">C</span>
      <h1>Citrusアプリ</h1>
      <p>AQUACULTURE OPS</p>
    </div>
    <p class="tagline">陸上養殖オペレーション管理</p>

    <a href="user/login.html" class="role-btn">
      <span class="role-icon"><span class="icon" data-icon="user"></span></span>
      <div>
        <p class="role-title">現場作業者</p>
        <p class="role-sub">給餌・観察・測定の記録（モバイル）</p>
      </div>
      <span class="role-chevron"><span class="icon" data-icon="chevron"></span></span>
    </a>

    <a href="admin/login.html" class="role-btn">
      <span class="role-icon"><span class="icon" data-icon="shield"></span></span>
      <div>
        <p class="role-title">工場長・管理者</p>
        <p class="role-sub">水質モニタ・生育推移・設定（PC）</p>
      </div>
      <span class="role-chevron"><span class="icon" data-icon="chevron"></span></span>
    </a>

    <p class="muted center" style="font-size: 11px; margin-top: 22px;">
      ※ 提案用HTMLデザインモックです<br>水質は水質管理システムから自動連携想定
    </p>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
