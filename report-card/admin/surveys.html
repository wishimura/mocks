<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>アンケート管理（将来機能） | あゆみ運営</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body class="admin">
<div class="app">
  <header class="header">
    <div class="brand"><span class="brand-mark">運</span><span>アンケート管理</span></div>
    <div class="header-spacer"></div>
    <span class="badge badge-soon">将来機能</span>
  </header>

  <main class="main">
    <div class="notice mb">
      <span class="icon" data-icon="star"></span>
      <div>この画面は<strong>将来機能のイメージ</strong>です。保護者へアンケートを配信し、教育ニーズの把握やサービス改善に活用します。</div>
    </div>

    <button class="btn btn-block mb" data-demo="アンケート作成（モック）"><span class="icon" data-icon="plus"></span>アンケートを作成</button>

    <h2 class="section-title"><span class="icon" data-icon="clipboard"></span>配信中・過去のアンケート</h2>
    <div class="stack">
      <div class="card">
        <div class="row-split">
          <p class="fw-bold">学習に関する意識調査</p>
          <span class="badge badge-done">配信中</span>
        </div>
        <p class="muted text-sm mt-sm">回答 642 / 1,284 ・ 回答率 50%</p>
      </div>
      <div class="card">
        <div class="row-split">
          <p class="fw-bold">アプリの使い心地アンケート</p>
          <span class="badge badge-grade">集計済</span>
        </div>
        <p class="muted text-sm mt-sm">回答 880 / 1,150 ・ 満足度 4.3 / 5</p>
      </div>
      <div class="card">
        <div class="row-split">
          <p class="fw-bold">習い事に関するニーズ調査</p>
          <span class="badge badge-soon">下書き</span>
        </div>
        <p class="muted text-sm mt-sm">未配信</p>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="dashboard.html" data-page="dashboard.html"><span class="nav-icon icon" data-icon="home"></span>ダッシュ</a>
    <a href="users.html" data-page="users.html"><span class="nav-icon icon" data-icon="users"></span>利用者</a>
    <a href="surveys.html" data-page="surveys.html"><span class="nav-icon icon" data-icon="clipboard"></span>アンケート</a>
    <a href="sponsors.html" data-page="sponsors.html"><span class="nav-icon icon" data-icon="megaphone"></span>広告</a>
  </nav>
</div>
<script src="../js/app.js"></script>
</body>
</html>
