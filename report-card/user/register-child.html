<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>お子さま登録 | あゆみ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="brand-mark">あ</span>
      <h1>お子さま登録</h1>
      <p>STEP 2 / 2 — 子ども別管理のための情報</p>
    </div>

    <form data-login data-login-to="home.html">
      <div class="form-group">
        <label class="form-label">お子さまのお名前<span class="req">必須</span></label>
        <input type="text" class="form-input" placeholder="山田 太郎" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">在籍区分</label>
          <select class="form-select">
            <option>小学校</option>
            <option>中学校</option>
            <option>高等学校</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">現在の学年</label>
          <select class="form-select">
            <option>1年</option><option>2年</option><option selected>3年</option>
            <option>4年</option><option>5年</option><option>6年</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">学校名（任意）</label>
        <input type="text" class="form-input" placeholder="〇〇市立 〇〇小学校" />
      </div>
      <div class="form-group">
        <label class="form-label">アイコンカラー</label>
        <div class="row" data-select-group>
          <span class="avatar av-1 selected" data-select style="cursor:pointer;">太</span>
          <span class="avatar av-2" data-select style="cursor:pointer;">太</span>
          <span class="avatar av-3" data-select style="cursor:pointer;">太</span>
          <span class="avatar av-4" data-select style="cursor:pointer;">太</span>
        </div>
      </div>
      <button type="submit" class="btn btn-block btn-lg">登録して始める</button>
      <p class="form-hint center mt-sm">お子さまは後からマイページでも追加できます。</p>
    </form>

    <p class="center mt">
      <a href="register.html" class="back-link"><span class="icon" data-icon="back"></span>戻る</a>
    </p>
  </div>
</div>
<script src="../js/app.js"></script>
</body>
</html>
