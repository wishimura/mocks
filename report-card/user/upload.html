<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>通知表を保存 | あゆみ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app">
  <header class="header">
    <a href="home.html" class="back-link"><span class="icon icon-lg" data-icon="back"></span></a>
    <div class="brand" style="font-size:16px;">通知表を保存</div>
  </header>

  <main class="main">
    <div class="card">
      <div class="form-group">
        <label class="form-label">どのお子さま？<span class="req">必須</span></label>
        <div class="row" data-select-group>
          <button type="button" class="pill pill-select selected" data-select style="padding:8px 14px;"><span class="avatar av-1" style="width:24px;height:24px;border-radius:7px;font-size:11px;">太</span>太郎</button>
          <button type="button" class="pill pill-select" data-select style="padding:8px 14px;"><span class="avatar av-2" style="width:24px;height:24px;border-radius:7px;font-size:11px;">花</span>花子</button>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">学年</label>
          <select class="form-select">
            <option>小1</option><option>小2</option><option selected>小3</option>
            <option>小4</option><option>小5</option><option>小6</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">学期</label>
          <select class="form-select">
            <option>前期</option><option selected>後期</option>
            <option>1学期</option><option>2学期</option><option>3学期</option>
          </select>
        </div>
      </div>
    </div>

    <h2 class="section-title"><span class="icon" data-icon="camera"></span>通知表の画像</h2>
    <div class="dropzone" data-demo="モックです。実際にはカメラ撮影／ファイル選択ができます。">
      <span class="icon icon-xl" data-icon="upload"></span>
      <p class="dropzone-title">画像をアップロード</p>
      <p class="text-sm">タップして撮影、または写真を選択<br>（複数ページもまとめて保存できます）</p>
    </div>

    <h2 class="section-title"><span class="icon" data-icon="image"></span>プレビュー</h2>
    <div class="upload-preview">
      <div class="ph">
        <span class="badge badge-img tag">通知表_小3後期.jpg</span>
        <span class="icon icon-xl" data-icon="image"></span>
      </div>
    </div>

    <div class="notice mt">
      <span class="icon" data-icon="star"></span>
      <div><strong>近日対応：</strong>アップロードした画像から科目・評価を自動で読み取って下書きを作成します。</div>
    </div>

    <div class="stack mt-lg">
      <button class="btn btn-block btn-lg" data-goto="entry.html">
        <span class="icon" data-icon="edit"></span>保存して内容を手入力する
      </button>
      <button class="btn btn-secondary btn-block" data-goto="complete.html?mode=image">
        画像のみ保存する
      </button>
    </div>
  </main>
</div>
<script src="../js/app.js"></script>
</body>
</html>
