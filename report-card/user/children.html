<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>子ども別管理 | あゆみ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app">
  <header class="header">
    <div class="brand"><span class="brand-mark">あ</span><span>子ども別管理</span></div>
    <div class="header-spacer"></div>
    <button class="icon-btn" data-demo="子ども追加（モック）"><span class="icon icon-lg" data-icon="plus"></span></button>
  </header>

  <main class="main">
    <p class="muted text-sm mb">お子さまごとに通知表をまとめて管理できます。タップすると学年別の一覧を表示します。</p>

    <div class="child-grid">
      <a href="child-detail.html" class="child-card">
        <span class="avatar avatar-lg av-1">太</span>
        <p class="child-card-name">太郎</p>
        <p class="child-card-grade">小学3年生</p>
        <span class="child-card-count">通知表 8件</span>
      </a>
      <a href="child-detail.html" class="child-card">
        <span class="avatar avatar-lg av-2">花</span>
        <p class="child-card-name">花子</p>
        <p class="child-card-grade">小学1年生</p>
        <span class="child-card-count">通知表 6件</span>
      </a>
      <a href="register-child.html" class="child-card add">
        <span class="icon icon-xl" data-icon="plus"></span>
        お子さまを追加
      </a>
    </div>

    <h2 class="section-title"><span class="icon" data-icon="growth"></span>将来機能</h2>
    <a href="growth.html" class="list-item">
      <span class="role-icon" style="background:var(--growth-light);color:var(--growth);"><span class="icon icon-lg" data-icon="trendUp"></span></span>
      <div class="list-item-body">
        <p class="list-item-title">成長記録</p>
        <p class="list-item-sub">学年をまたいだ評価の推移をグラフで振り返る</p>
      </div>
      <span class="badge badge-soon">将来機能</span>
    </a>
  </main>

  <nav class="bottom-nav">
    <a href="home.html" data-page="home.html"><span class="nav-icon icon" data-icon="home"></span>ホーム</a>
    <a href="children.html" data-page="children.html"><span class="nav-icon icon" data-icon="child"></span>子ども</a>
    <a href="upload.html" data-page="upload.html" class="fab"><span class="nav-icon"><span class="icon" data-icon="plus"></span></span></a>
    <a href="timeline.html" data-page="timeline.html"><span class="nav-icon icon" data-icon="book"></span>一覧</a>
    <a href="mypage.html" data-page="mypage.html"><span class="nav-icon icon" data-icon="user"></span>マイページ</a>
  </nav>
</div>
<script src="../js/app.js"></script>
</body>
</html>
