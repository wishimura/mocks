<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>保存しました | あゆみ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app">
  <main class="main" style="min-height:80vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;">
    <span class="role-icon" style="width:80px;height:80px;border-radius:24px;background:var(--growth-light);color:var(--growth);">
      <span class="icon" data-icon="checkCircle" style="width:42px;height:42px;"></span>
    </span>
    <h1 style="font-size:22px;font-weight:800;margin-top:18px;">保存しました</h1>
    <p class="muted mt-sm">太郎さん「小学3年 後期」の通知表を<br>保存しました。家族みんながいつでも閲覧できます。</p>

    <div class="card mt-lg" style="width:100%;text-align:left;">
      <div class="row" style="gap:12px;">
        <span class="record-thumb"><span class="icon icon-lg" data-icon="image"></span></span>
        <div style="flex:1;">
          <p class="fw-bold">太郎 ・ 小3 後期</p>
          <div class="row mt-sm" style="gap:6px;">
            <span class="badge badge-img"><span class="icon" data-icon="image" style="width:13px;height:13px;"></span>画像 1枚</span>
            <span class="badge badge-done"><span class="icon" data-icon="check" style="width:13px;height:13px;"></span>入力済</span>
          </div>
        </div>
      </div>
    </div>

    <div class="stack mt-lg" style="width:100%;">
      <button class="btn btn-block btn-lg" data-goto="view.html"><span class="icon" data-icon="eye"></span>保存した通知表を見る</button>
      <button class="btn btn-secondary btn-block" data-goto="upload.html"><span class="icon" data-icon="plus"></span>続けて別の通知表を保存</button>
      <button class="btn btn-ghost btn-block" data-goto="home.html">ホームに戻る</button>
    </div>
  </main>
</div>
<script src="../js/app.js"></script>
</body>
</html>
