<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>あゆみ | 通知表保管アプリ モック</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="role-card">
    <div class="auth-logo">
      <span class="brand-mark">あ</span>
      <h1>あゆみ</h1>
      <p>通知表保管アプリ</p>
    </div>
    <p class="center muted text-sm" style="margin-bottom: 22px;">
      お子さまの通知表を、写真とデータで家族みんなが見られる場所に。
    </p>

    <a href="user/login.html" class="role-btn">
      <span class="role-icon"><span class="icon" data-icon="users"></span></span>
      <div>
        <p class="role-title">保護者の方はこちら</p>
        <p class="role-sub">通知表の保存・閲覧・手入力・子ども別管理</p>
      </div>
      <span class="role-chevron"><span class="icon" data-icon="chevron"></span></span>
    </a>

    <a href="admin/login.html" class="role-btn">
      <span class="role-icon accent"><span class="icon" data-icon="shield"></span></span>
      <div>
        <p class="role-title">運営管理画面</p>
        <p class="role-sub">利用者管理・アンケート・スポンサー広告（将来機能）</p>
      </div>
      <span class="role-chevron"><span class="icon" data-icon="chevron"></span></span>
    </a>

    <p class="muted center text-xs" style="margin-top: 22px;">
      ※ これは要件整理のためのHTMLデザインモックです（DB接続なし）
    </p>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
