<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ユーザー登録 | みっけ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="brand-mark">み</span>
      <h1>ユーザー登録</h1>
      <p>STEP 1 / 2 — 保護者アカウント</p>
    </div>
    <form data-login data-login-to="register-child.html">
      <div class="form-group">
        <label class="form-label">保護者のお名前<span class="req">必須</span></label>
        <input type="text" class="form-input" placeholder="山田 花子" />
      </div>
      <div class="form-group">
        <label class="form-label">メールアドレス<span class="req">必須</span></label>
        <input type="email" class="form-input" placeholder="you@example.com" />
      </div>
      <div class="form-group">
        <label class="form-label">パスワード<span class="req">必須</span></label>
        <input type="password" class="form-input" placeholder="8文字以上" />
      </div>
      <div class="form-group">
        <label class="row text-sm" style="gap:8px; align-items:flex-start;">
          <input type="checkbox" checked style="margin-top:4px;" />
          <span><a href="#" data-demo="利用規約（モック）">利用規約</a>・<a href="#" data-demo="プライバシーポリシー（モック）">プライバシーポリシー</a>に同意します</span>
        </label>
      </div>
      <button type="submit" class="btn btn-block btn-lg">次へ（お子さま登録）</button>
    </form>
    <p class="center mt"><a href="login.html" class="back-link"><span class="icon" data-icon="back"></span>ログインに戻る</a></p>
  </div>
</div>
<script src="../js/app.js"></script>
</body>
</html>
