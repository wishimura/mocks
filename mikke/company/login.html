<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>企業ログイン | みっけ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body class="company">
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="brand-mark"><span class="icon" data-icon="briefcase" style="width:26px;height:26px;"></span></span>
      <h1>みっけ for Business</h1>
      <p>COMPANY CONSOLE</p>
    </div>
    <form data-login data-login-to="dashboard.html">
      <div class="form-group"><label class="form-label">企業アカウントID</label><input type="email" class="form-input" value="company@nature-lab.example" /></div>
      <div class="form-group"><label class="form-label">パスワード</label><input type="password" class="form-input" value="companysample" /></div>
      <button type="submit" class="btn btn-block btn-lg">ログイン</button>
    </form>
    <p class="center text-sm mt"><a href="#" data-demo="企業の新規登録（モック）">企業の新規登録はこちら</a></p>
    <p class="center mt"><a href="../index.html" class="back-link"><span class="icon" data-icon="back"></span>入口に戻る</a></p>
  </div>
</div>
<script src="../js/app.js"></script>
</body>
</html>
