<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>運営ログイン | みっけ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body class="admin">
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="brand-mark" style="background:linear-gradient(135deg,#3b50c4,#6173e6);">運</span>
      <h1>みっけ 運営</h1>
      <p>ADMIN CONSOLE</p>
    </div>
    <form data-login data-login-to="dashboard.html">
      <div class="form-group"><label class="form-label">管理者ID</label><input type="text" class="form-input" value="admin@mikke.example" /></div>
      <div class="form-group"><label class="form-label">パスワード</label><input type="password" class="form-input" value="adminsample" /></div>
      <button type="submit" class="btn btn-block btn-lg">ログイン</button>
    </form>
    <p class="center mt"><a href="../index.html" class="back-link"><span class="icon" data-icon="back"></span>入口に戻る</a></p>
  </div>
</div>
<script src="../js/app.js"></script>
</body>
</html>
