<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>稲垣商店｜業務システム モック</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="role-wrap">
  <div class="role-card">
    <div class="role-logo">稲垣</div>
    <h1>稲垣商店 業務システム</h1>
    <p class="role-sub">価格算出・運賃算出・在庫管理（棚卸）モック</p>

    <a href="user/login.html" class="role-btn">
      <span class="role-icon" data-icon="calculator"></span>
      <span>
        <span class="role-title">現場・営業スタッフ</span>
        <span class="role-desc">価格算出／運賃算出／在庫確認</span>
      </span>
      <span class="role-arrow icon-sm" data-icon="chevron"></span>
    </a>
    <a href="admin/login.html" class="role-btn admin">
      <span class="role-icon" data-icon="settings"></span>
      <span>
        <span class="role-title">管理者</span>
        <span class="role-desc">タリフ・資材マスタ・在庫全体管理</span>
      </span>
      <span class="role-arrow icon-sm" data-icon="chevron"></span>
    </a>

    <p class="role-foot">※ 本画面はデモ用モックです。実際のデータ・通信は発生しません。</p>
  </div>
</div>
<script src="js/app.js"></script>
</body>
</html>
