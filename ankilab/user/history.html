<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>学習履歴 | アンキラボ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app">
  <header class="header">
    <h1>学習履歴</h1>
  </header>

  <main class="main">
    <div class="stats">
      <div class="card"><p class="card-title">連続日数</p><p class="card-value">12日</p></div>
      <div class="card"><p class="card-title">累計問題数</p><p class="card-value">1,590</p></div>
      <div class="card"><p class="card-title">平均正答率</p><p class="card-value">83%</p></div>
    </div>

    <div class="card">
      <p class="card-title">学習カレンダー（直近12週）</p>
      <div class="heatmap">
        <span></span><span class="heat-1"></span><span class="heat-2"></span><span></span><span class="heat-3"></span><span class="heat-1"></span><span class="heat-4"></span>
        <span class="heat-2"></span><span class="heat-3"></span><span></span><span class="heat-1"></span><span class="heat-4"></span><span class="heat-2"></span><span class="heat-3"></span>
        <span class="heat-1"></span><span></span><span class="heat-2"></span><span class="heat-4"></span><span class="heat-3"></span><span class="heat-1"></span><span class="heat-2"></span>
        <span class="heat-4"></span><span class="heat-3"></span><span class="heat-2"></span><span></span><span class="heat-1"></span><span class="heat-3"></span><span class="heat-4"></span>
        <span class="heat-2"></span><span class="heat-4"></span><span class="heat-3"></span><span class="heat-1"></span><span class="heat-2"></span><span class="heat-4"></span><span class="heat-4"></span>
        <span class="heat-1"></span><span class="heat-2"></span><span class="heat-4"></span><span class="heat-3"></span><span class="heat-4"></span><span class="heat-2"></span><span class="heat-4"></span>
      </div>
      <p class="muted" style="font-size:11.5px; margin-top:8px;">色が濃いほど解いた問題数が多い日です</p>
    </div>

    <div class="card" style="margin-top:12px;">
      <p class="card-title">週別 正答率の推移</p>
      <div class="bar-chart">
        <div class="bar-col"><div class="bar" style="height:60%;"></div><div class="bar-label">3週前</div></div>
        <div class="bar-col"><div class="bar" style="height:68%;"></div><div class="bar-label">2週前</div></div>
        <div class="bar-col"><div class="bar" style="height:74%;"></div><div class="bar-label">先週</div></div>
        <div class="bar-col"><div class="bar" style="height:83%; background:var(--accent);"></div><div class="bar-label">今週</div></div>
      </div>
    </div>

    <div class="section-title">最近の学習セッション</div>
    <div class="item-list">
      <div class="review-row" style="background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 14px; display:flex; align-items:center; gap:12px;">
        <span class="review-mark ok"><span class="icon" data-icon="check" style="width:14px;height:14px;"></span></span>
        <div style="flex:1;"><div class="review-word">英単語ターゲット1900・4択</div><div class="review-sub">今日 7:40 - 10問中8問正解</div></div>
      </div>
      <div class="review-row" style="background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 14px; display:flex; align-items:center; gap:12px;">
        <span class="review-mark ok"><span class="icon" data-icon="check" style="width:14px;height:14px;"></span></span>
        <div style="flex:1;"><div class="review-word">漢字マスター・スペル入力</div><div class="review-sub">昨日 21:10 - 15問中12問正解</div></div>
      </div>
      <div class="review-row" style="background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 14px; display:flex; align-items:center; gap:12px;">
        <span class="review-mark ng"><span class="icon" data-icon="x" style="width:14px;height:14px;"></span></span>
        <div style="flex:1;"><div class="review-word">漢字検定2級 対策・4択</div><div class="review-sub">昨日 20:32 - 10問中4問正解</div></div>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <a href="home.html" data-page="home.html"><span class="nav-icon icon" data-icon="home"></span>ホーム</a>
    <a href="deck.html" data-page="deck.html"><span class="nav-icon icon" data-icon="layers"></span>デッキ</a>
    <a href="ranking.html" data-page="ranking.html"><span class="nav-icon icon" data-icon="trophy"></span>ランキング</a>
    <a href="history.html" data-page="history.html"><span class="nav-icon icon" data-icon="clock"></span>履歴</a>
    <a href="mypage.html" data-page="mypage.html"><span class="nav-icon icon" data-icon="user"></span>マイページ</a>
  </nav>
</div>
<script src="../js/app.js"></script>
</body>
</html>
