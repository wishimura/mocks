<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>問題を編集 | アンキラボ管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app">
  <header class="header">
    <a href="questions.html" class="back"><span class="icon icon-lg" data-icon="back"></span></a>
    <h1>問題を編集</h1>
    <button class="header-action" data-demo="保存しました（モック動作）">保存</button>
  </header>

  <main class="main">
    <div class="card">
      <div class="form-group">
        <label class="form-label">デッキ</label>
        <select class="form-select">
          <option>英単語ターゲット1900</option>
          <option>漢字マスター 中学範囲</option>
          <option>漢字検定2級 対策</option>
          <option>世界史 一問一答</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">問題（単語・見出し）</label>
        <input class="form-input" value="abundant" />
      </div>
      <div class="form-group">
        <label class="form-label">意味・読み（答え）</label>
        <input class="form-input" value="豊富な、有り余るほどの" />
      </div>
      <div class="form-group">
        <label class="form-label">補足・同義語（任意）</label>
        <input class="form-input" value="synonym: plentiful, ample" />
      </div>
    </div>

    <div class="card" style="margin-top:12px;">
      <p class="card-title">4択の選択肢</p>
      <div class="form-group">
        <label class="form-label">選択肢 A</label>
        <input class="form-input" value="乏しい、不足した" />
      </div>
      <div class="form-group">
        <label class="form-label">選択肢 B（正解） ✓</label>
        <input class="form-input" value="豊富な、有り余るほどの" style="border-color:var(--success); background:var(--success-light);" />
      </div>
      <div class="form-group">
        <label class="form-label">選択肢 C</label>
        <input class="form-input" value="無関心な" />
      </div>
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label">選択肢 D</label>
        <input class="form-input" value="一時的な" />
      </div>
    </div>

    <div class="card" style="margin-top:12px;">
      <p class="card-title">スペル入力モード</p>
      <div class="setting-row">
        <div><p class="setting-title">この問題をスペル入力に出題</p><p class="setting-sub">キーボードで正しいスペルを入力させる</p></div>
        <label class="toggle"><input type="checkbox" checked /><span class="toggle-track"></span></label>
      </div>
      <div class="form-group" style="margin-top:12px; margin-bottom:0;">
        <label class="form-label">スペル正解（英字）</label>
        <input class="form-input" value="abundant" style="font-family:'Poppins',monospace;" />
        <p class="form-hint">大文字・小文字は区別しません。前後の空白は自動で除去します。</p>
      </div>
    </div>

    <div style="display:flex; gap:10px; margin-top:16px;">
      <button class="btn btn-danger" style="flex-shrink:0;" data-demo="この問題を削除しました（モック動作）"><span class="icon" data-icon="trash"></span>削除</button>
      <button class="btn btn-block" data-demo="保存しました（モック動作）">保存する</button>
    </div>
  </main>
</div>
<script src="../js/app.js"></script>
</body>
</html>
